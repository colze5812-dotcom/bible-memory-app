<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>성경 암송 카드 — 네비게이토</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a56a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="암송카드">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f9f9f9;
  --text:#1c1c1e;--text2:#6c6c70;--text3:#aeaeb2;
  --border:#e5e5ea;
  --blue:#1a56a0;--blue-soft:#e8f0fb;
  --green:#1a7a4a;--green-soft:#e6f5ee;
  --orange:#c05c00;--orange-soft:#fdf0e6;
  --purple:#5a2d8c;--purple-soft:#f0eaf8;
  --teal:#0a7070;--teal-soft:#e5f5f5;
  --red:#b01a1a;--red-soft:#faeaea;
  --accent:var(--blue);
  --shadow:0 2px 16px rgba(0,0,0,.07);
  --shadow2:0 8px 32px rgba(0,0,0,.13);
  --r:18px;--r-sm:12px;
  --fs:16px;
  --header-h:56px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-dark]{
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;
  --text:#fff;--text2:#8e8e93;--text3:#48484a;
  --border:#38383a;
  --blue:#4a9eff;--blue-soft:#0d2040;
  --green:#32d074;--green-soft:#0d2a1a;
  --orange:#ff9f0a;--orange-soft:#2a1800;
  --purple:#bf5af2;--purple-soft:#1e0a30;
  --teal:#5ac8fa;--teal-soft:#002830;
  --red:#ff453a;--red-soft:#2a0a0a;
  --shadow:0 2px 16px rgba(0,0,0,.4);
  --shadow2:0 8px 32px rgba(0,0,0,.6);
}

html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--fs);
  transition:background .25s,color .25s}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:calc(var(--header-h) + var(--safe-t));
  padding-top:var(--safe-t);
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding-left:4px;padding-right:8px;
  gap:4px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#topbar-title{flex:1;font-size:1rem;font-weight:700;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tb-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;
  font-size:1.15rem;color:var(--text2);display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;transition:background .15s}
.tb-btn:active{background:var(--border)}
.tb-back{color:var(--accent);font-size:1rem;font-weight:600;
  display:flex;align-items:center;gap:2px;white-space:nowrap}

/* font controls */
.font-ctrl{display:flex;align-items:center;gap:2px}
.font-ctrl button{background:none;border:none;cursor:pointer;
  width:32px;height:32px;border-radius:8px;font-weight:700;
  color:var(--accent);font-size:.85rem;
  display:flex;align-items:center;justify-content:center;transition:background .15s}
.font-ctrl button:active{background:var(--border)}

/* ── SCROLL AREA ── */
#app{
  position:fixed;top:calc(var(--header-h) + var(--safe-t));
  bottom:calc(var(--safe-b));
  left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px 24px;
}
.inner{max-width:480px;margin:0 auto}

/* ── HOME ── */
.stats-card{
  background:var(--accent);color:#fff;
  border-radius:var(--r);padding:20px 24px;margin-bottom:20px;
  box-shadow:var(--shadow2);
}
.stats-card .greeting{font-size:.82rem;opacity:.8;margin-bottom:6px}
.stats-card .big{font-size:2.6rem;font-weight:800;line-height:1;margin-bottom:2px}
.stats-card .sub{font-size:.82rem;opacity:.75}
.stats-row{display:flex;gap:10px;margin-top:14px}
.stats-row .s{flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:10px;text-align:center}
.stats-row .s .n{font-size:1.3rem;font-weight:800}
.stats-row .s .l{font-size:.7rem;opacity:.8;margin-top:2px}

.section-label{font-size:.78rem;font-weight:700;color:var(--text2);
  letter-spacing:.06em;text-transform:uppercase;margin:8px 0 10px 4px}

.sc{
  background:var(--card);border-radius:var(--r);
  padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);cursor:pointer;
  transition:transform .12s,box-shadow .12s;
  border:1px solid var(--border);
}
.sc:active{transform:scale(.98);box-shadow:none}
.sc-icon{
  width:46px;height:46px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;flex-shrink:0;
}
.sc-info{flex:1;min-width:0}
.sc-title{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:3px}
.sc-sub{font-size:.75rem;color:var(--text2)}
.sc-prog{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.sc-prog-fill{height:100%;border-radius:2px;transition:width .4s}
.sc-count{font-size:.8rem;font-weight:700;color:#fff;
  border-radius:20px;padding:3px 10px;white-space:nowrap;flex-shrink:0}

/* color helpers */
.col-blue{background:var(--blue)}
.col-green{background:var(--green)}
.col-orange{background:var(--orange)}
.col-purple{background:var(--purple)}
.col-teal{background:var(--teal)}
.col-red{background:var(--red)}
.col-blue-soft{background:var(--blue-soft)}
.col-green-soft{background:var(--green-soft)}
.col-orange-soft{background:var(--orange-soft)}
.col-purple-soft{background:var(--purple-soft)}
.col-teal-soft{background:var(--teal-soft)}
.col-red-soft{background:var(--red-soft)}
.txt-blue{color:var(--blue)}
.txt-green{color:var(--green)}
.txt-orange{color:var(--orange)}
.txt-purple{color:var(--purple)}
.txt-teal{color:var(--teal)}
.txt-red{color:var(--red)}

/* ── SECTION ── */
.sec-hero{
  border-radius:var(--r);padding:20px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.sec-hero h2{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:4px}
.sec-hero p{font-size:.82rem;color:rgba(255,255,255,.8)}
.sec-hero-prog{height:4px;background:rgba(255,255,255,.3);border-radius:2px;margin-top:14px;overflow:hidden}
.sec-hero-prog-fill{height:100%;background:#fff;border-radius:2px;transition:width .4s}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.subcard{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:14px 12px;
  cursor:pointer;text-align:center;transition:all .15s;
}
.subcard:active{transform:scale(.97)}
.subcard.sel{border-width:2px}
.subcard .st{font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:4px}
.subcard .sc2{font-size:.72rem;color:var(--text2)}
.subcard .mini-prog{height:2px;background:var(--border);border-radius:1px;margin-top:8px;overflow:hidden}
.subcard .mini-prog-fill{height:100%;border-radius:1px}

.start-all{
  width:100%;padding:15px;color:#fff;border:none;
  border-radius:var(--r-sm);font-size:1rem;font-weight:700;
  cursor:pointer;margin-bottom:16px;
  box-shadow:var(--shadow);transition:opacity .15s;
}
.start-all:active{opacity:.85}

.sub-block{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.sub-header{display:flex;align-items:center;gap:8px;padding:13px 14px 8px;cursor:pointer}
.sub-header:active{background:rgba(0,0,0,.04)}
.sub-htitle{flex:1;font-size:.88rem;font-weight:700;color:var(--text)}
.sub-hcount{font-size:.72rem;color:var(--text2);white-space:nowrap}
.sub-hbtn{font-size:.75rem;font-weight:700;color:#fff;border-radius:20px;padding:3px 10px;white-space:nowrap;flex-shrink:0}
.sub-hprog{height:2px;background:var(--border);margin:0 14px 8px;overflow:hidden;border-radius:1px}
.sub-hprog-fill{height:100%;border-radius:1px}
.topic-list{border-top:1px solid var(--border)}
.topic-row{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.topic-row:last-child{border-bottom:none}
.topic-row:active{background:rgba(0,0,0,.04)}
.topic-rname{flex:1;font-size:.82rem;color:var(--text)}
.topic-rcnt{font-size:.72rem;color:var(--text2);white-space:nowrap}
.topic-rarrow{font-size:1.1rem;color:var(--text2);margin-left:2px}

.vlist{display:flex;flex-direction:column;gap:8px}
.vi{
  background:var(--card);border-radius:var(--r-sm);
  padding:13px 14px;box-shadow:var(--shadow);
  cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--border);transition:transform .1s;
}
.vi:active{transform:scale(.99)}
.vi.done{border-left:3px solid var(--green)}
.vi .vr{font-size:.78rem;font-weight:700;min-width:72px;padding-top:1px}
.vi .vt{font-size:.8rem;color:var(--text2);line-height:1.5;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi .vc{font-size:.9rem;margin-left:4px}

/* ── CARDS ── */
.card-wrap{
  display:flex;flex-direction:column;height:100%;
}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-counter{font-size:.85rem;font-weight:700;color:var(--text2)}
.card-topic{font-size:.75rem;color:var(--text3);background:var(--card2);
  padding:3px 10px;border-radius:20px}

.prog-wrap{margin-bottom:18px}
.prog-track{background:var(--border);border-radius:3px;height:4px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;transition:width .35s}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:all .25s}
.dot.on{background:var(--accent);width:18px;border-radius:3px}

.flashcard{perspective:1200px;height:280px;margin-bottom:20px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:100%;
  transition:transform .55s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r);box-shadow:var(--shadow2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;
}
.fc-front{color:#fff}
.fc-back{background:var(--card);transform:rotateY(180deg);
  border:1px solid var(--border);overflow-y:auto}
.fc-topic{font-size:.75rem;opacity:.75;
  background:rgba(255,255,255,.18);padding:3px 12px;border-radius:20px;margin-bottom:14px}
.fc-ref{font-size:1.7rem;font-weight:800;text-align:center;letter-spacing:-.5px}
.fc-hint{position:absolute;bottom:18px;font-size:.72rem;opacity:.55;
  display:flex;align-items:center;gap:4px}
.fc-ref-sm{font-size:.8rem;font-weight:700;margin-bottom:12px;text-align:center}
.fc-text{font-size:var(--fs);line-height:1.8;text-align:center;color:var(--text)}

/* swipe animation */
.flashcard.swipe-left{animation:swl .25s ease forwards}
.flashcard.swipe-right{animation:swr .25s ease forwards}
@keyframes swl{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-60px);opacity:0}}
@keyframes swr{0%{transform:translateX(0);opacity:1}100%{transform:translateX(60px);opacity:0}}

.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-row button{
  flex:1;padding:14px;border:none;border-radius:var(--r-sm);
  font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;
}
.btn-row button:active{opacity:.8;transform:scale(.97)}
.btn-prev{background:var(--card2);color:var(--text);border:1px solid var(--border)!important}
.btn-next{color:#fff}
.btn-know{background:var(--green);color:#fff}
.btn-again{background:var(--red);color:#fff}

.mem-toggle{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:12px;background:var(--card);
  border-radius:var(--r-sm);border:1px solid var(--border);
  cursor:pointer;margin-bottom:10px;transition:background .15s;
}
.mem-toggle:active{background:var(--card2)}
.mem-toggle span{font-size:.88rem;font-weight:600;color:var(--text2)}
.mem-toggle .check-icon{font-size:1.2rem}
.mem-toggle.done{background:var(--green-soft);border-color:var(--green)}
.mem-toggle.done span{color:var(--green)}

.swipe-hint{text-align:center;font-size:.72rem;color:var(--text3);margin-top:4px}

/* ── LANDING ── */
.landing-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100svh - var(--header-h) - var(--safe-t) - var(--safe-b) - 32px);
  padding:24px 20px;
}
.landing-logo{width:130px;height:130px;margin-bottom:20px;
  filter:drop-shadow(0 8px 24px rgba(26,86,160,.35))}
.landing-title{font-size:2.1rem;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.5px}
.landing-sub{font-size:.82rem;color:var(--text2);margin-bottom:40px;letter-spacing:.04em}
.landing-btn{
  width:100%;max-width:300px;padding:18px 24px;border:none;border-radius:var(--r);
  font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:13px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:var(--shadow2);transition:transform .12s,opacity .15s;
  color:#fff;
}
.landing-btn:active{transform:scale(.97);opacity:.9}
.landing-btn:last-child{margin-bottom:0}
.landing-backup-row{display:flex;gap:10px;margin-top:24px;width:100%;max-width:300px}
.landing-backup-btn{
  flex:1;padding:11px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--text2);font-size:.82rem;font-weight:600;cursor:pointer;
  transition:background .12s,color .12s;
}
.landing-backup-btn:active{background:var(--border);color:var(--text)}
.landing-btn-icon{font-size:1.5rem}
.bible-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100svh - var(--header-h) - var(--safe-t) - var(--safe-b) - 80px);
  text-align:center;padding:32px 24px;
}
.bible-placeholder .big-icon{font-size:3.5rem;margin-bottom:20px}
.bible-placeholder h2{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:10px}
.bible-placeholder p{font-size:.88rem;color:var(--text2);line-height:1.8}

/* ── BIBLE STUDY ── */
.bs-hero{background:var(--teal);color:#fff;border-radius:var(--r);
  padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow2)}
.bs-hero h1{font-size:1.35rem;font-weight:800;margin-bottom:4px}
.bs-hero p{font-size:.8rem;opacity:.82}
.bs-lesson-row{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:14px 16px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:transform .12s;box-shadow:var(--shadow)}
.bs-lesson-row:active{transform:scale(.98)}
.bs-circle{width:38px;height:38px;border-radius:50%;
  background:var(--teal);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800}
.bs-lesson-info{flex:1;min-width:0}
.bs-lesson-name{font-size:.88rem;font-weight:700;color:var(--text)}
.bs-lesson-stat{font-size:.72rem;color:var(--text2);margin-top:2px}
.bs-mini-bar{height:2px;background:var(--border);border-radius:1px;margin-top:5px;overflow:hidden}
.bs-mini-fill{height:100%;background:var(--teal);border-radius:1px}
.bs-l-hero{background:var(--teal);color:#fff;border-radius:var(--r);
  padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow2)}
.bs-l-hero .lnum{font-size:.75rem;opacity:.78;letter-spacing:.04em;margin-bottom:4px}
.bs-l-hero h2{font-size:1.15rem;font-weight:800}
.bs-qcard{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.bs-qbadge{display:inline-block;font-size:.7rem;font-weight:800;
  color:var(--teal);background:var(--teal-soft);
  border-radius:20px;padding:2px 10px;margin-bottom:10px}
.bs-qtext{font-size:.88rem;font-weight:600;color:var(--text);line-height:1.65;margin-bottom:5px}
.bs-qrefs{font-size:.75rem;color:var(--teal);font-weight:500;margin-bottom:10px}
.bs-items{margin:0 0 10px 2px}
.bs-item{font-size:.8rem;color:var(--text2);padding:3px 0 3px 16px;
  position:relative;line-height:1.45}
.bs-item::before{content:'▸';position:absolute;left:2px;
  color:var(--teal);font-size:.65rem;top:5px}
.bs-sub{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.bs-sublabel{font-size:.83rem;font-weight:600;color:var(--text);
  line-height:1.55;margin-bottom:5px}
.bs-subrefs{font-size:.72rem;color:var(--teal);margin-bottom:8px}
.bs-ta{width:100%;min-height:90px;border:1.5px solid var(--border);
  border-radius:10px;padding:10px 12px;font-size:.85rem;
  font-family:inherit;color:var(--text);background:var(--bg);
  resize:vertical;line-height:1.65;outline:none;
  transition:border-color .2s;display:block;margin-top:6px}
.bs-ta:focus{border-color:var(--teal)}
.bs-ta.fl{border-color:var(--green)}
.bs-save-row{display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 8px;margin-top:8px}
.bs-save-btn{padding:12px 28px;background:var(--teal);color:#fff;
  border:none;border-radius:var(--r-sm);font-size:.9rem;font-weight:700;
  cursor:pointer;transition:opacity .15s;box-shadow:var(--shadow)}
.bs-save-btn:active{opacity:.85}
.bs-save-msg{font-size:.8rem;color:var(--green);font-weight:600}
.bs-memo-box{background:var(--card);border:1.5px dashed var(--border);
  border-radius:var(--r-sm);padding:14px;margin-bottom:14px}
.bs-memo-label{font-size:.78rem;font-weight:700;color:var(--text2);margin-bottom:8px;
  display:flex;align-items:center;gap:6px}
.bs-memo-ta{width:100%;min-height:80px;border:1.5px solid var(--border);
  border-radius:10px;padding:10px 12px;font-size:.85rem;
  font-family:inherit;color:var(--text);background:var(--bg);
  resize:vertical;line-height:1.65;outline:none;
  transition:border-color .2s;display:block}
.bs-memo-ta:focus{border-color:var(--teal)}

/* ── BOOK TABS ── */
.bs-book-tabs{display:flex;gap:8px;margin-bottom:16px}
.bs-book-tab{flex:1;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--text2);font-size:.82rem;font-weight:700;cursor:pointer;
  transition:all .15s;text-align:center}
.bs-book-tab:active{opacity:.8}
.bs-book-tab.active{border-color:currentColor;background:var(--teal-soft);color:var(--teal)}
.bs-book-tab.active.purple{background:var(--purple-soft);color:var(--purple)}

/* ── REF TOGGLE ── */
.bs-ref-toggle{
  display:inline-flex;align-items:center;gap:5px;
  cursor:pointer;font-size:.74rem;font-weight:600;
  margin-bottom:10px;padding:4px 11px;border-radius:20px;
  border:1.5px solid currentColor;transition:opacity .15s;user-select:none;
  color:var(--teal)
}
.bs-ref-toggle:active{opacity:.7}
.bs-ref-toggle .rt-arrow{font-size:.65rem;transition:transform .2s}
.bs-ref-toggle.open .rt-arrow{transform:rotate(180deg)}
.bs-ref-panel{
  display:none;background:var(--teal-soft);
  border-left:3px solid var(--teal);border-radius:0 8px 8px 0;
  padding:10px 13px;margin-bottom:10px;
}
.bs-ref-panel.open{display:block}
.bs-ref-verse{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.07)}
.bs-ref-verse:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.bs-ref-key{font-size:.7rem;font-weight:800;color:var(--teal);display:block;margin-bottom:3px}
.bs-ref-text{font-size:.82rem;line-height:1.75;color:var(--text)}
.bs-ref-miss{font-size:.8rem;color:var(--text3);font-style:italic}
/* ── GAME ── */
.game-sel-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.game-sel-count{font-size:.82rem;color:var(--purple);font-weight:700}
.game-sel-all{font-size:.78rem;color:var(--text2);cursor:pointer;padding:4px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.game-sec-cb{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:7px;cursor:pointer}
.game-sec-cb input[type=checkbox]{width:18px;height:18px;accent-color:var(--purple);flex-shrink:0}
.gsc-info{flex:1}.gsc-title{font-size:.85rem;font-weight:700;color:var(--text)}.gsc-count{font-size:.72rem;color:var(--text2);margin-top:2px}
.game-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.game-type-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--r-sm);padding:16px 10px;cursor:pointer;text-align:center;transition:all .15s}
.game-type-btn.sel{border-color:var(--purple);background:var(--purple-soft)}.game-type-btn:active{opacity:.8}
.gt-icon{font-size:1.8rem;margin-bottom:6px}.gt-name{font-size:.82rem;font-weight:700;color:var(--text)}
.game-start-btn{width:100%;padding:16px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:1rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow2);transition:opacity .15s}
.game-start-btn:active{opacity:.85}.game-start-btn:disabled{opacity:.35;cursor:default}
.game-score-row{display:flex;gap:8px;margin-bottom:12px}
.game-score-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.gsn{font-size:1.3rem;font-weight:800}.gsl{font-size:.7rem;color:var(--text2);margin-top:2px}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.game-ref{font-size:1rem;font-weight:800;color:var(--purple);margin-bottom:10px}
.game-verse-text{font-size:.88rem;line-height:1.8;color:var(--text)}
.game-blank{display:inline-block;min-width:60px;height:1.3em;background:var(--purple-soft);border-bottom:2px solid var(--purple);border-radius:4px;vertical-align:middle;margin:0 3px;padding:0 6px;font-weight:700;color:var(--purple)}
.game-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.game-choice{padding:12px 8px;background:var(--card2);border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;color:var(--text);line-height:1.4}
.game-choice:active{opacity:.8}.game-choice.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}.game-choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.game-next-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:.92rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s}
.game-next-btn:active{opacity:.85}
.word-zone{min-height:54px;background:var(--bg);border:1.5px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.word-chips-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.word-chip{padding:7px 11px;border-radius:20px;font-size:.84rem;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;border:1.5px solid transparent}
.word-chip.avail{background:var(--purple-soft);border-color:var(--purple);color:var(--purple)}.word-chip.avail:active{opacity:.7}
.word-chip.placed{background:var(--card);border-color:var(--border);color:var(--text)}
.game-ta{width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:.9rem;font-family:inherit;color:var(--text);background:var(--bg);resize:none;outline:none;line-height:1.7;box-sizing:border-box;transition:border-color .2s}
.game-ta:focus{border-color:var(--purple)}
.game-submit-btn{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:var(--r-sm);font-size:.92rem;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s}
.game-submit-btn:active{opacity:.85}
.typing-result{margin-top:10px;padding:12px;border-radius:10px;font-size:.88rem;font-weight:600;line-height:1.7}
.typing-result.good{background:var(--green-soft);color:var(--green);border:1px solid var(--green)}.typing-result.ok{background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange)}.typing-result.bad{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.typing-answer{margin-top:8px;padding:10px;background:var(--card2);border-radius:8px;font-size:.83rem;line-height:1.75;color:var(--text);font-weight:400}
.game-end-wrap{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center}
.game-end-icon{font-size:3.5rem;margin-bottom:12px}.game-end-score{font-size:3rem;font-weight:800;color:var(--purple);margin-bottom:6px}
.game-end-sub{font-size:.9rem;color:var(--text2);margin-bottom:28px;line-height:1.6}
.game-end-btn{padding:13px 36px;border:none;border-radius:var(--r-sm);font-size:.95rem;font-weight:700;cursor:pointer;margin:5px;box-shadow:var(--shadow);min-width:160px}

<!-- 동기화 모달 -->
<div id="sync-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center">
  <div style="background:var(--card);border-radius:16px;padding:28px 24px;width:min(340px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.25)">

             font-size:.9rem;color:var(--text);background:var(--bg);font-family:inherit;outline:none;margin-bottom:14px">

        style="flex:1;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:.88rem;font-weight:700;cursor:pointer">

      <button onclick="closeSyncModal()"
        style="padding:11px 16px;background:var(--bg2,var(--bg));color:var(--text2);border:1px solid var(--border);border-radius:10px;font-size:.88rem;cursor:pointer">
        취소
      </button>
    </div>

<!-- 토스트 -->

  font-size:.85rem;font-weight:600;opacity:0;transition:opacity .4s;z-index:9998;pointer-events:none"></div>
<div id="app"><div class="inner"></div></div>

<!-- ── Firebase compat SDK ── -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===================== FIREBASE SYNC =====================
// 기도제목보드와 같은 프로젝트/보안 방식을 씁니다.
//  - 익명 로그인을 통과한 요청만 Firestore에 접근합니다.
//  - 동기화 코드를 아는 기기끼리만 같은 데이터를 봅니다.
(function(){
  const cfg={
    apiKey:"AIzaSyBAY23Egx4F3R8K-G5dh9oZBZrZzfmREtY",
    authDomain:"prayer-requests-9d290.firebaseapp.com",
    projectId:"prayer-requests-9d290",
    storageBucket:"prayer-requests-9d290.firebasestorage.app",
    messagingSenderId:"1035359222112",
    appId:"1:1035359222112:web:feaae8bd9daaabbdb84605"
  };
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  window._db=firebase.firestore();
  // 익명 로그인 — 규칙의 request.auth != null 을 통과하기 위해 필요
  window._authReady=firebase.auth().signInAnonymously()
    .catch(e=>{ console.warn('익명 로그인 실패',e); throw e; });
})();
let _syncId=localStorage.getItem('nav_sync_id')||'';
const SYNC_MIN=6;

// ── 훈련관 모드 ──
// 훈련관앱이 iframe 으로 열 때 ?board=<보드id>&me=<멤버id>&name=<이름> 을 붙인다.
// 이때는 동기화 코드 대신 boards/<보드id>/bible/<멤버id> 아래에 답변·메모·외운 구절을 저장한다.
const _qp=new URLSearchParams(location.search);
const _board=(_qp.get('board')||'').trim(), _me=(_qp.get('me')||'').trim(), _meName=(_qp.get('name')||'').trim();
const _boardMode=!!(_board.length>=20 && _me);
function syncRef(){
  return _boardMode
    ? _db.collection('boards').doc(_board).collection('bible').doc(_me)
    : _db.collection('bible_sync').doc(_syncId);
}
function syncOn(){ return _boardMode || !!_syncId; }

// 오류를 사람이 읽을 수 있는 문장으로
function fbErrMsg(e){
  const c=(e&&e.code)||'';
  if(c.indexOf('permission')>=0||/insufficient permissions/i.test(e&&e.message||''))
    return '권한 없음 — Firestore 규칙에 bible_sync 를 추가해야 합니다.';
  if(c.indexOf('unavailable')>=0||c.indexOf('network')>=0) return '인터넷 연결을 확인해주세요.';
  if(c.indexOf('auth')>=0) return '로그인 실패 — 익명 로그인이 꺼져 있을 수 있습니다.';
  return '동기화 실패: '+((e&&e.message)||e);
}

// 양방향 동기화.
//  내려받기: 클라우드에 있는 내용을 로컬에 덮어씁니다.
//  올려보내기: 로컬에만 있는 내용을 클라우드로 보냅니다.
//    (동기화를 켜기 전에 이 기기에서 채워둔 답변이 여기서 올라갑니다.
//     이게 없으면 클라우드가 계속 비어 있어서 다른 기기에 아무것도 안 뜹니다.)
async function fbLoad(){
  if(!syncOn()) return {down:0,up:0};
  await _authReady;
  const ref=syncRef();
  const [aSnap,mSnap,dSnap]=await Promise.all([
    ref.collection('answers').get(),
    ref.collection('memos').get(),
    _boardMode ? ref.get() : Promise.resolve(null)
  ]);
  // 훈련관 모드: 외운 구절은 클라우드와 로컬을 합친다 (어느 쪽이든 외웠으면 외운 것)
  if(_boardMode){
    const cloudMem=(dSnap && dSnap.exists && dSnap.data().memorized)||{};
    let changed=false;
    for(const k in cloudMem){ if(cloudMem[k] && !memorized[k]){ memorized[k]=true; changed=true; } }
    localStorage.setItem('nav_memorized', JSON.stringify(memorized));
    fbSaveMem();   // 합친 결과를 올려 둔다 (이름·개수도 같이)
  }

  // 1) 클라우드 → 로컬 (겹치면 클라우드가 이깁니다)
  const cloudA={},cloudM={};
  aSnap.forEach(d=>{cloudA[d.id]=d.data().v;});
  mSnap.forEach(d=>{cloudM[d.id]=d.data().v;});
  let down=0;
  for(const k in cloudA){ if(bsAnswers[k]!==cloudA[k]){ bsAnswers[k]=cloudA[k]; down++; } }
  for(const k in cloudM){ if(bsMemos[k]!==cloudM[k]){ bsMemos[k]=cloudM[k]; down++; } }

  // 2) 로컬에만 있는 것 → 클라우드
  const ups=[];
  for(const k in bsAnswers)
    if((bsAnswers[k]||'').trim() && !(k in cloudA)) ups.push([ref.collection('answers').doc(k),bsAnswers[k]]);
  for(const k in bsMemos)
    if((bsMemos[k]||'').trim() && !(k in cloudM)) ups.push([ref.collection('memos').doc(k),bsMemos[k]]);

  for(let i=0;i<ups.length;i+=400){   // 배치 1회 한도는 500
    const batch=_db.batch();
    ups.slice(i,i+400).forEach(p=>batch.set(p[0],{v:p[1]}));
    await batch.commit();
  }

  localStorage.setItem('nav_bible_answers',JSON.stringify(bsAnswers));
  localStorage.setItem('nav_bible_memos',JSON.stringify(bsMemos));
  return {down:down,up:ups.length};
}
async function fbSaveAns(key,val){
  if(!syncOn()) return;
  try{
    await _authReady;
    await syncRef().collection('answers').doc(key).set({v:val});
  }catch(e){ console.warn('답변 저장 실패',e); showSyncMsg('⚠️ '+fbErrMsg(e)); }
}
async function fbSaveMemo(lid,val){
  if(!syncOn()) return;
  try{
    await _authReady;
    await syncRef().collection('memos').doc(lid).set({v:val});
  }catch(e){ console.warn('메모 저장 실패',e); showSyncMsg('⚠️ '+fbErrMsg(e)); }
}
// 외운 구절 — 훈련관 모드에서만 (문서 하나에 통째로, 훈련관앱이 개수를 읽어 보여준다)
let _memTimer=null;
function fbSaveMem(){
  if(!_boardMode) return;
  clearTimeout(_memTimer);
  _memTimer=setTimeout(async()=>{
    try{
      await _authReady;
      await syncRef().set({
        memorized:memorized, memCount:totalMem(), total:totalCards(), name:_meName,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    }catch(e){ console.warn('암송 저장 실패',e); showSyncMsg('⚠️ '+fbErrMsg(e)); }
  },600);
}
function syncApply(id){
  _syncId=(id||'').trim();
  localStorage.setItem('nav_sync_id',_syncId);
  const st=document.getElementById('sync-status');
  if(st) st.textContent=_syncId?'☁️ '+_syncId:'';
  if(!_syncId){ showSyncMsg('동기화 해제됨'); return; }
  showSyncMsg('동기화 중…');
  fbLoad().then(r=>{
    render();
    const p=[];
    if(r.down) p.push('내려받음 '+r.down+'개');
    if(r.up)   p.push('올려보냄 '+r.up+'개');
    showSyncMsg(p.length?('동기화 완료 — '+p.join(', ')):'동기화 완료 — 이미 최신입니다');
  }).catch(e=>{
    console.warn('fbLoad 실패',e);
    showSyncMsg('⚠️ '+fbErrMsg(e));
  });
}
function showSyncMsg(msg){
  const el=document.getElementById('sync-toast');
  if(!el) return;
  el.textContent=msg; el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',2500);
}
function openSyncModal(){
  if(_boardMode){ showSyncMsg('훈련관앱과 연결되어 있습니다. 따로 코드가 필요 없어요.'); return; }
  document.getElementById('sync-modal').style.display='flex';
  document.getElementById('sync-input').value=_syncId;
}
function closeSyncModal(){ document.getElementById('sync-modal').style.display='none'; }
function confirmSync(){
  const v=document.getElementById('sync-input').value.trim();
  if(!v){ alert('동기화 코드를 입력해주세요.'); return; }
  if(v.length<SYNC_MIN){ alert('동기화 코드는 '+SYNC_MIN+'자 이상으로 정해주세요.\n(짧으면 남이 추측할 수 있습니다)'); return; }
  syncApply(v); closeSyncModal();
}
function clearSync(){ syncApply(''); closeSyncModal(); }
</script>

'마5:1,2':'예수께서 무리를 보시고 산에 올라가 앉으시니 제자들이 나아온지라 입을 열어 가르쳐 이르시되',
'마6:9-13':'그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며 나라가 임하시오며 뜻이 하늘에서 이루어진 것 같이 땅에서도 이루어지이다 오늘 우리에게 일용할 양식을 주시옵고 우리가 우리에게 죄 지은 자를 사하여 준 것 같이 우리 죄를 사하여 주시옵고 우리를 시험에 들게 하지 마시옵고 다만 악에서 구하시옵소서 나라와 권세와 영광이 아버지께 영원히 있사옵나이다 아멘',
'마5:13-16':'너희는 세상의 소금이니 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요 후에는 아무 쓸 데 없어 다만 밖에 버려져 사람에게 밟힐 뿐이니라 너희는 세상의 빛이라 산 위에 있는 동네가 숨겨지지 못할 것이요 사람이 등불을 켜서 말 아래에 두지 아니하고 등경 위에 두나니 이러므로 집 안 모든 사람에게 비치느니라 이같이 너희 빛이 사람 앞에 비치게 하여 그들로 너희 착한 행실을 보고 하늘에 계신 너희 아버지께 영광을 돌리게 하라',
'마6:19-21,24,33':'너희를 위하여 보물을 땅에 쌓아 두지 말라 거기는 좀과 동록이 해하며 도둑이 구멍을 뚫고 도둑질하느니라 오직 너희를 위하여 보물을 하늘에 쌓아 두라 거기는 좀이나 동록이 해하지 못하며 도둑이 구멍을 뚫지도 못하고 도둑질도 못하느니라 네 보물 있는 그곳에는 네 마음도 있느니라 … 한 사람이 두 주인을 섬기지 못할 것이니 … 그런즉 너희는 먼저 그의 나라와 그의 의를 구하라',
'마6:24':'한 사람이 두 주인을 섬기지 못할 것이니 혹 이를 미워하고 저를 사랑하거나 혹 이를 중히 여기고 저를 경히 여김이라 너희가 하나님과 재물을 겸하여 섬기지 못하느니라',
'마6:33':'그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라',
'마7:24-27':'그러므로 누구든지 나의 이 말을 듣고 행하는 자는 그 집을 반석 위에 지은 지혜로운 사람 같으리니 비가 내리고 창수가 나고 바람이 불어 그 집에 부딪치되 무너지지 아니하나니 이는 주추를 반석 위에 놓은 까닭이요 나의 이 말을 듣고 행하지 아니하는 자는 그 집을 모래 위에 지은 어리석은 사람 같으리니 비가 내리고 창수가 나고 바람이 불어 그 집에 부딪치매 무너져 그 무너짐이 심하니라',
'마9:36':'무리를 보시고 불쌍히 여기시니 이는 그들이 목자 없는 양과 같이 고생하며 기진함이라',
'마14:23':'무리를 보내신 후에 기도하러 따로 산에 올라가시니라 저물매 거기 혼자 계시더니',
'마16:15,16':'이르시되 너희는 나를 누구라 하느냐 시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다',
'마16:16-18':'시몬 베드로가 대답하여 이르되 주는 그리스도시요 살아 계신 하나님의 아들이시니이다 예수께서 대답하여 이르시되 바요나 시몬아 네가 복이 있도다 이를 네게 알게 한 이는 혈육이 아니요 하늘에 계신 내 아버지시니라 또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라',
'마28:19,20':'그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라',
'막1:14,15,38,39':'요한이 잡힌 후 예수께서 갈릴리에 오셔서 하나님의 복음을 전파하여 이르시되 때가 찼고 하나님의 나라가 가까이 왔으니 회개하고 복음을 믿으라 … 이르시되 우리가 다른 가까운 마을들로 가자 거기서도 전도하리니 내가 이를 위하여 왔노라 하시고 온 갈릴리에 다니시며 그들의 여러 회당에서 전도하시고 또 귀신들을 내쫓으시더라',
'막1:35':'새벽 아직도 밝기 전에 예수께서 일어나 나가 한적한 곳으로 가사 거기서 기도하시더니',
'막2:7,10':'이 사람이 어찌 이렇게 말하는가 신성 모독이로다 오직 하나님 한 분 외에는 누가 능히 죄를 사하겠느냐 … 인자가 땅에서 죄를 사하는 권세가 있는 줄을 너희로 알게 하려 하노라',
'막4:39-41':'예수께서 깨어 바람을 꾸짖으시며 바다더러 이르시되 잠잠하라 고요하라 하시니 바람이 그치고 아주 잔잔하여지더라 이에 제자들에게 이르시되 어찌하여 이렇게 무서워하느냐 너희가 어찌 믿음이 없느냐 하시니 그들이 심히 두려워하여 서로 말하되 그가 누구이기에 바람과 바다도 순종하는가 하였더라',
'막7:6,7':'이르시되 이사야가 너희 외식하는 자에 대하여 잘 예언하였도다 기록하였으되 이 백성이 입술로는 나를 공경하되 마음은 내게서 멀도다 사람의 계명으로 교훈을 삼아 가르치니 나를 헛되이 경배하는도다 하였느니라',
'막10:41':'열 제자가 듣고 야고보와 요한에 대하여 화를 내거늘',
'막10:42-45':'예수께서 불러다가 이르시되 이방인의 집권자들이 그들을 임의로 주관하고 그 고관들이 그들에게 권세를 부리는 줄을 너희가 알거니와 너희 중에는 그렇지 않을지니 너희 중에 누구든지 크고자 하는 자는 너희를 섬기는 자가 되고 너희 중에 누구든지 으뜸이 되고자 하는 자는 모든 사람의 종이 되어야 하리라 인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라',
'막10:45':'인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라',
'막16:15':'또 이르시되 너희는 온 천하에 다니며 만민에게 복음을 전파하라',
'눅2:10,11':'천사가 이르되 무서워하지 말라 보라 내가 온 백성에게 미칠 큰 기쁨의 좋은 소식을 너희에게 전하노라 오늘 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라',
'눅5:5,6':'시몬이 대답하여 이르되 선생님 우리들이 밤이 새도록 수고하였으되 잡은 것이 없지마는 말씀에 의지하여 내가 그물을 내리리이다 하고 그렇게 하니 고기를 잡은 것이 심히 많아 그물이 찢어지는지라',
'눅5:16':'예수는 물러가사 한적한 곳에서 기도하시니라',
'눅24:25-27,32-35':'이르시되 미련하고 선지자들이 말한 모든 것을 마음에 더디 믿는 자들이여 그리스도가 이런 고난을 받고 자기의 영광에 들어가야 할 것이 아니냐 하시고 이에 모세와 모든 선지자의 글로 시작하여 모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라 … 그들이 서로 말하되 길에서 우리에게 말씀하시고 우리에게 성경을 풀어 주실 때에 우리 속에서 마음이 뜨겁지 아니하더냐',
'눅5:20,32':'예수께서 그들의 믿음을 보시고 이르시되 이 사람아 네 죄 사함을 받았느니라 하시니 … 내가 의인을 부르러 온 것이 아니요 죄인을 불러 회개시키러 왔노라',
'눅6:20-23':'예수께서 눈을 들어 제자들을 보시고 이르시되 가난한 자는 복이 있나니 하나님의 나라가 너희 것임이요 지금 주린 자는 복이 있나니 너희가 배부름을 얻을 것임이요 지금 우는 자는 복이 있나니 너희가 웃을 것임이요 인자로 말미암아 사람들이 너희를 미워하며 멀리하고 욕하고 너희 이름을 악하다 하여 버릴 때에는 너희에게 복이 있도다 그 날에 기뻐하고 뛰놀라 하늘에서 너희 상이 큼이라',
'눅6:46':'너희는 나를 불러 주여 주여 하면서도 어찌하여 내가 말하는 것을 행하지 아니하느냐',
'눅8:15':'좋은 땅에 있다는 것은 착하고 좋은 마음으로 말씀을 듣고 지키어 인내로 결실하는 자니라',
'눅9:23':'또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라',
'눅11:1':'예수께서 한 곳에서 기도하시고 마치시매 제자 중 하나가 여짜오되 주여 요한이 자기 제자들에게 기도를 가르친 것과 같이 우리에게도 가르쳐 주옵소서',
'눅11:2-4':'예수께서 이르시되 너희는 기도할 때에 이렇게 하라 아버지여 이름이 거룩히 여김을 받으시오며 나라가 임하시오며 우리에게 날마다 일용할 양식을 주시옵고 우리가 우리에게 죄 지은 모든 사람을 용서하오니 우리 죄도 사하여 주시옵고 우리를 시험에 들게 하지 마시옵소서 하라',
'눅14:27':'누구든지 자기 십자가를 지고 나를 따르지 않는 자도 능히 내 제자가 되지 못하리라',
'눅15:28-30':'그가 노하여 들어가고자 하지 아니하거늘 아버지가 나와서 권한대 아버지께 대답하여 이르되 내가 여러 해 아버지를 섬겨 명을 어김이 없거늘 내게는 염소 새끼라도 주어 나와 내 벗으로 즐기게 하신 일이 없더니 아버지의 살림을 창녀들과 함께 삼켜 버린 이 아들이 오매 이를 위하여 살진 송아지를 잡으셨나이다',
'요1:5,9':'빛이 어둠에 비치되 어둠이 깨닫지 못하더라 … 참 빛 곧 세상에 와서 각 사람에게 비추는 빛이 있었나니',
'요1:12':'영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니',
'요1:29':'이튿날 요한이 예수께서 자기에게 나아오심을 보고 이르되 보라 세상 죄를 지고 가는 하나님의 어린 양이로다',
'요3:6,7':'육으로 난 것은 육이요 영으로 난 것은 영이니 내가 네게 거듭나야 하겠다 하는 말을 놀랍게 여기지 말라',
'요3:19-21':'그 정죄는 이것이니 곧 빛이 세상에 왔으되 사람들이 자기 행위가 악하므로 빛보다 어둠을 더 사랑한 것이니라 악을 행하는 자마다 빛을 미워하여 빛으로 오지 아니하나니 이는 그 행위가 드러날까 함이요 진리를 따르는 자는 빛으로 오나니 이는 그 행위가 하나님 안에서 행한 것임을 나타내려 함이라',
'요4:35-38':'너희는 넉 달이 지나야 추수할 때가 이르겠다 하지 아니하느냐 그러나 나는 너희에게 이르노니 너희 눈을 들어 밭을 보라 희어져 추수하게 되었도다 거두는 자가 이미 삯도 받고 영생에 이르는 열매를 모으나니 이는 뿌리는 자와 거두는 자가 함께 즐거워하게 하려 함이라 그런즉 한 사람이 심고 다른 사람이 거둔다 하는 말이 옳도다',
'요6:60,61,64-66':'제자 중 여럿이 듣고 말하되 이 말씀은 어렵도다 누가 들을 수 있느냐 한대 예수께서 스스로 제자들이 이 말씀에 대하여 수군거리는 줄 아시고 이르시되 이 말이 너희에게 걸림이 되느냐 … 그러나 너희 중에 믿지 아니하는 자들이 있느니라 하시니 이는 예수께서 믿지 아니하는 자들이 누구며 자기를 팔 자가 누구인지 처음부터 아심이러라 또 이르시되 그러므로 전에 너희에게 말하기를 내 아버지께서 오게 하여 주지 아니하시면 누구든지 내게 올 수 없다 하였노라 하시니 그 때부터 제자 중에서 많은 사람이 떠나가고 다시 그와 함께 다니지 아니하더라',
'요6:27':'썩을 양식을 위하여 일하지 말고 영생하도록 있는 양식을 위하여 하라 이 양식은 인자가 너희에게 주리니 인자는 아버지 하나님께서 인치신 자니라',
'요8:12':'예수께서 또 말씀하여 이르시되 나는 세상의 빛이니 나를 따르는 자는 어둠에 다니지 아니하고 생명의 빛을 얻으리라',
'요8:31':'그러므로 예수께서 자기를 믿은 유대인들에게 이르시되 너희가 내 말에 거하면 참으로 내 제자가 되고',
'요8:31,32':'그러므로 예수께서 자기를 믿은 유대인들에게 이르시되 너희가 내 말에 거하면 참으로 내 제자가 되고 진리를 알지니 진리가 너희를 자유롭게 하리라',

'요15:4,5':'내 안에 거하라 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음 같이 너희도 내 안에 있지 아니하면 그러하리라 나는 포도나무요 너희는 가지라 그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니 나를 떠나서는 너희가 아무것도 할 수 없음이라',

'행2:36':'그런즉 이스라엘 온 집은 확실히 알지니 너희가 십자가에 못 박은 이 예수를 하나님이 주와 그리스도가 되게 하셨느니라 하니라',
'행2:42-47':'그들이 사도의 가르침을 받아 서로 교제하고 떡을 떼며 오로지 기도하기를 힘쓰니라 … 날마다 마음을 같이하여 성전에 모이기를 힘쓰고 집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고 하나님을 찬미하며 또 온 백성에게 칭송을 받으니 주께서 구원 받는 사람을 날마다 더하게 하시니라',
'행4:11,12':'이 예수는 너희 건축자들의 버린 돌로서 집 모퉁이의 머릿돌이 되었느니라 다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라',
'행17:11':'베뢰아에 있는 사람들은 데살로니가에 있는 사람들보다 더 너그러워서 간절한 마음으로 말씀을 받고 이것이 그러한가 하여 날마다 성경을 상고하므로',
'행17:11,12':'베뢰아에 있는 사람들은 데살로니가에 있는 사람들보다 더 너그러워서 간절한 마음으로 말씀을 받고 이것이 그러한가 하여 날마다 성경을 상고하므로 그 중에 믿는 사람이 많고 또 헬라의 귀부인과 남자가 적지 아니하니라',

'롬1:3,4':'그의 아들에 관하여 말하면 육신으로는 다윗의 혈통에서 나셨고 성결의 영으로는 죽은 자들 가운데서 부활하사 능력으로 하나님의 아들로 선포되셨으니 곧 우리 주 예수 그리스도시니라',

'롬5:6,8,11':'우리가 아직 연약할 때에 기약대로 그리스도께서 경건하지 않은 자를 위하여 죽으셨도다 … 우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라 … 이뿐 아니라 이제 우리로 화목하게 하신 우리 주 예수 그리스도로 말미암아 하나님 안에서 또한 즐거워하느니라',
'롬7:21-23':'그러므로 내가 한 법을 깨달았노니 곧 선을 행하기 원하는 나에게 악이 함께 있는 것이로다 내 속사람으로는 하나님의 법을 즐거워하되 내 지체 속에서 한 다른 법이 내 마음의 법과 싸워 내 지체 속에 있는 죄의 법으로 나를 사로잡는 것을 보는도다',
'롬10:11-17,21':'성경이 이르되 누구든지 그를 믿는 자는 부끄러움을 당하지 아니하리라 하니 유대인이나 헬라인이나 차별이 없음이라 한 분이 모든 사람의 주가 되사 그를 부르는 모든 사람에게 부요하시도다 누구든지 주의 이름을 부르는 자는 구원을 받으리라 그런즉 그들이 믿지 아니하는 이를 어찌 부르리요 듣지도 못한 이를 어찌 믿으리요 전파하는 자가 없이 어찌 들으리요 보내심을 받지 아니하였으면 어찌 전파하리요 기록된 바 아름답도다 좋은 소식을 전하는 자들의 발이여 함과 같으니라 그러나 그들이 다 복음을 순종하지 아니하였도다 … 이스라엘에 대하여는 이르되 순종하지 아니하고 거슬러 말하는 백성에게 내가 종일 내 손을 벌렸노라 하셨느니라',
'롬10:9':'네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라',
'롬10:9,10':'네가 만일 네 입으로 예수를 주로 시인하며 또 하나님께서 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라 사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라',

'롬14:7,8':'우리 중에 누구든지 자기를 위하여 사는 자가 없고 자기를 위하여 죽는 자도 없도다 우리가 살아도 주를 위하여 살고 죽어도 주를 위하여 죽나니 그러므로 사나 죽으나 우리가 주의 것이로다',
'롬14:8,9':'우리가 살아도 주를 위하여 살고 죽어도 주를 위하여 죽나니 그러므로 사나 죽으나 우리가 주의 것이로다 이를 위하여 그리스도께서 죽었다가 다시 살아나셨으니 곧 죽은 자와 산 자의 주가 되려 하심이라',

'고후5:17':'그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다',

'고후12:15':'내가 너희 영혼을 위하여 크게 기뻐함으로 비용을 쓰고 또 내 자신까지 내어 주리라 내가 너희를 심히 사랑할수록 너희가 나를 더 적게 사랑하느냐',
'갈2:20':'내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라',
'갈5:19-24':'육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 이단과 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요 오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라 그리스도 예수의 사람들은 육체와 함께 그 정욕과 탐심을 십자가에 못 박았느니라',
'갈5:16-18':'내가 이르노니 너희는 성령을 따라 행하라 그리하면 육체의 욕심을 이루지 아니하리라 육체의 소욕은 성령을 거스르고 성령은 육체를 거스르나니 이 둘이 서로 대적함으로 너희가 원하는 것을 하지 못하게 하려 함이니라 너희가 만일 성령의 인도하시는 바가 되면 율법 아래에 있지 아니하리라',
'갈5:22,23':'오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라',
'엡2:8,9':'너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라',
'엡2:20,21':'너희는 사도들과 선지자들의 터 위에 세우심을 받은 자라 그리스도 예수께서 친히 모퉁잇돌이 되셨느니라 그의 안에서 건물마다 서로 연결하여 주 안에서 성전이 되어 가고',
'엡4:2,3':'모든 겸손과 온유로 하고 오래 참음으로 사랑 가운데서 서로 용납하고 평안의 매는 줄로 성령이 하나 되게 하신 것을 힘써 지키라',
'엡4:20-24':'오직 너희는 그리스도를 이같이 배우지 아니하였느니라 … 너희는 유혹의 욕심을 따라 썩어져 가는 구습을 따르는 옛 사람을 벗어 버리고 오직 너희의 심령이 새롭게 되어 하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라',
'엡5:8':'너희가 전에는 어둠이더니 이제는 주 안에서 빛이라 빛의 자녀들처럼 행하라',
'빌2:3,4':'아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라',
'빌2:5-8':'너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니 그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고 오히려 자기를 비워 종의 형체를 가지사 사람들과 같이 되셨고 사람의 모양으로 나타나사 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라',
'빌2:10,11':'하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고 모든 입으로 예수 그리스도를 주라 시인하여 하나님 아버지께 영광을 돌리게 하셨느니라',
'빌2:25-27,30':'에바브로디도를 너희에게 보내는 것이 필요한 줄로 생각하노니 그는 나의 형제요 함께 일하는 자요 함께 군사 된 자요 너희 사자로 내가 쓸 것을 돕는 자라 … 그가 병들어 죽게 되었으나 하나님이 그를 긍휼히 여기셨고 … 그리스도의 일을 위하여 죽기에 이르러도 자기 목숨을 돌보지 아니한 것은 나를 섬기는 너희의 일에 부족함을 채우려 함이니라',
'빌3:7,8':'그러나 무엇이든지 내게 유익하던 것을 내가 그리스도를 위하여 다 해로 여길뿐더러 또한 모든 것을 해로 여김은 내 주 그리스도 예수를 아는 지식이 가장 고상하기 때문이라 내가 그를 위하여 모든 것을 잃어버리고 배설물로 여김은 그리스도를 얻고',
'빌4:6,7':'아무것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라',
'빌4:11-13':'내가 어떠한 형편에 있든지 자족하기를 배웠노라 나는 비천에 처할 줄도 알고 풍부에 처할 줄도 알아 모든 일 곧 배부름과 배고픔과 풍부와 궁핍에도 처할 줄 아는 일체의 비결을 배웠노라 내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라',
'빌4:13':'내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라',
'골1:13':'그가 우리를 흑암의 권세에서 건져내사 그의 사랑의 아들의 나라로 옮기셨으니',
'골1:15,16':'그는 보이지 아니하는 하나님의 형상이시요 모든 피조물보다 먼저 나신 이시니 만물이 그에게서 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 왕권들이나 주권들이나 통치자들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고',
'골1:15-18':'그는 보이지 아니하는 하나님의 형상이시요 모든 피조물보다 먼저 나신 이시니 만물이 그에게서 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 왕권들이나 주권들이나 통치자들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고 또한 그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라 그는 몸인 교회의 머리시라 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요',
'골2:6':'그러므로 너희가 그리스도 예수를 주로 받았으니 그 안에서 행하되',
'골2:6,7':'그러므로 너희가 그리스도 예수를 주로 받았으니 그 안에서 행하되 그 안에 뿌리를 박으며 세움을 받아 교훈을 받은 대로 믿음에 굳게 서서 감사함을 넘치게 하라',
'골2:9-10':'그 안에는 신성의 모든 충만이 육체로 거하시고 너희도 그 안에서 충만하여졌으니 그는 모든 통치자와 권세의 머리시라',
'골3:1,2':'그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위의 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라 위의 것을 생각하고 땅의 것을 생각하지 말라',
'골3:5-10':'그러므로 땅에 있는 지체를 죽이라 곧 음란과 부정과 사욕과 악한 정욕과 탐심이니 탐심은 우상 숭배니라 이것들로 말미암아 하나님의 진노가 임하느니라 너희도 전에 그 가운데 살 때에는 그 가운데서 행하였으나 이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라 너희가 서로 거짓말을 하지 말라 옛 사람과 그 행위를 벗어 버리고 새 사람을 입었으니 이는 자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 받는 자니라',
'골3:16':'그리스도의 말씀이 너희 속에 풍성히 거하여 모든 지혜로 피차 가르치며 권면하고 시와 찬송과 신령한 노래를 부르며 감사하는 마음으로 하나님을 찬양하고',
'골4:2':'기도를 계속하고 기도에 감사함으로 깨어 있으라',
'살전3:12':'또 주께서 우리가 너희를 사랑함과 같이 너희도 피차간과 모든 사람에 대한 사랑이 더욱 많아 넘치게 하사',
'살전4:7':'하나님이 우리를 부르심은 부정하게 하심이 아니요 거룩하게 하심이니',
'살전5:17':'쉬지 말고 기도하라',
'딤전2:4,5':'하나님은 모든 사람이 구원을 받으며 진리를 아는 데에 이르기를 원하시느니라 하나님은 한 분이시요 또 하나님과 사람 사이에 중보자도 한 분이시니 곧 사람이신 그리스도 예수라',
'딤후2:20-22':'큰 집에는 금 그릇과 은 그릇뿐 아니라 나무 그릇과 질그릇도 있어 귀하게 쓰는 것도 있고 천하게 쓰는 것도 있나니 그러므로 누구든지 이런 것에서 자기를 깨끗하게 하면 귀히 쓰는 그릇이 되어 거룩하고 주인의 쓰심에 합당하며 모든 선한 일에 준비함이 되리라 또한 너는 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 따르라',
'딤후3:14':'그러나 너는 배우고 확신한 일에 거하라 너는 네가 누구에게서 배운 것을 알며',
'딤후3:15,16':'또 어려서부터 성경을 알았나니 성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라 모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니',
'딤후3:16,17':'모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니 이는 하나님의 사람으로 온전하게 하며 모든 선한 일을 행할 능력을 갖추게 하려 함이라',
'딛2:11-14':'모든 사람에게 구원을 주시는 하나님의 은혜가 나타나 우리를 양육하시되 경건하지 않은 것과 이 세상 정욕을 다 버리고 신중함과 의로움과 경건함으로 이 세상에 살고 복스러운 소망과 우리의 크신 하나님 구주 예수 그리스도의 영광이 나타나심을 기다리게 하셨으니 그가 우리를 대신하여 자신을 주심은 모든 불법에서 우리를 속량하시고 우리를 깨끗하게 하사 선한 일을 열심히 하는 자기 백성이 되게 하려 하심이라',
'히1:2,3':'이 모든 날 마지막에는 아들을 통하여 우리에게 말씀하셨으니 이 아들을 만유의 상속자로 세우시고 또 그로 말미암아 모든 세계를 지으셨느니라 이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결하게 하는 일을 하시고 높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라',
'히3:12,13':'형제들아 너희는 삼가 혹 너희 중에 누가 믿지 아니하는 악한 마음을 품고 살아 계신 하나님에게서 떨어질까 조심할 것이요 오직 오늘이라 일컫는 동안에 매일 피차 권면하여 너희 중에 누구든지 죄의 유혹으로 완고하게 되지 않도록 하라',
'히4:16':'그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라',
'히10:24,25':'서로 돌아보아 사랑과 선행을 격려하며 모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그날이 가까움을 볼수록 더욱 그리하자',
'히13:7':'하나님의 말씀을 너희에게 일러 주고 너희를 인도하던 자들을 생각하며 그들의 행실의 결말을 주의하여 보고 그들의 믿음을 본받으라',
'약1:5-7':'너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라 오직 믿음으로 구하고 조금도 의심하지 말라 의심하는 자는 마치 바람에 밀려 요동하는 바다 물결 같으니 이런 사람은 무엇이든지 주께 얻기를 생각하지 말라',
'약4:8':'하나님을 가까이하라 그리하면 너희를 가까이하시리라 죄인들아 손을 깨끗이 하라 두 마음을 품은 자들아 마음을 성결하게 하라',
'약4:13,14':'들으라 너희 중에 말하기를 오늘이나 내일이나 우리가 어떤 도시에 가서 거기서 일 년을 머물며 장사하여 이익을 보리라 하는 자들아 내일 일을 너희가 알지 못하는도다 너희 생명이 무엇이냐 너희는 잠깐 보이다가 없어지는 안개니라',

'렘30:19':'그들에게서 감사하는 소리와 즐거워하는 자의 소리가 나오게 하리라 내가 그들을 번성하게 하리니 그들이 감소되지 아니하겠고 내가 그들을 영화롭게 하리니 그들이 낮아지지 아니하리로다',
'호4:7':'그들이 번성할수록 내게 범죄하니 내가 그들의 영화를 변하여 욕이 되게 하리라',
'호10:1,2':'이스라엘은 열매 맺는 포도나무라 그 열매가 많을수록 제단을 많게 하며 그 땅이 아름다울수록 주상을 아름답게 하도다 그들의 마음이 간사하니 이제 그 죄를 담당하리라 여호와께서 그 제단을 쳐서 꺾으시며 그 주상을 허시리라',
'시92:12-14':'의인은 종려나무 같이 번성하며 레바논의 백향목 같이 성장하리로다 이는 여호와의 집에 심겼음이여 우리 하나님의 뜰 안에서 번성하리로다 그들은 늙어도 여전히 결실하며 진액이 풍족하고 빛이 청청하니',
'요12:24-26':'내가 진실로 진실로 너희에게 이르노니 한 알의 밀이 땅에 떨어져 죽지 아니하면 한 알 그대로 있고 죽으면 많은 열매를 맺느니라 자기의 생명을 사랑하는 자는 잃어버릴 것이요 이 세상에서 자기의 생명을 미워하는 자는 영생하도록 보전하리라 사람이 나를 섬기려면 나를 따르라 나 있는 곳에 나를 섬기는 자도 있으리니 사람이 나를 섬기면 내 아버지께서 그를 귀히 여기시리라',
'딤후2:1,2':'내 아들아 그러므로 너는 그리스도 예수 안에 있는 은혜 가운데서 강하고 또 네가 많은 증인 앞에서 내게 들은 바를 충성된 사람들에게 부탁하라 그들이 또 다른 사람들을 가르칠 수 있으리라',
'히6:14,15':'이르시되 내가 반드시 너에게 복 주고 복 주며 너를 번성하게 하고 번성하게 하리라 하셨더니 그가 이같이 오래 참아 약속을 받았느니라',
'히11:8,9,17-19':'믿음으로 아브라함은 부르심을 받았을 때에 순종하여 장래의 유업으로 받을 땅에 나아갈새 갈 바를 알지 못하고 나아갔으며 믿음으로 그가 이방의 땅에 있는 것 같이 약속의 땅에 거류하여 동일한 약속을 유업으로 함께 받은 이삭 및 야곱과 더불어 장막에 살았으니 아브라함은 시험을 받을 때에 믿음으로 이삭을 드렸으니 그는 약속들을 받은 자로되 그 외아들을 드렸느니라 그에게 이미 말씀하시기를 네 자손이라 칭할 자는 이삭으로 말미암으리라 하셨으니 그가 하나님이 능히 이삭을 죽은 자 가운데서 다시 살리실 줄로 생각한지라 비유컨대 그를 죽은 자 가운데서 도로 받은 것이니라',
'히11:11,12':'믿음으로 사라 자신도 나이가 많아 단산하였으나 잉태할 수 있는 힘을 얻었으니 이는 약속하신 이를 미쁘신 줄 알았음이라 이러므로 죽은 자와 같은 한 사람으로 말미암아 하늘의 허다한 별과 또 해변의 무수한 모래와 같이 많은 후손이 생육하였느니라',
'고전2:4,5':'내 말과 내 전도함이 설득력 있는 지혜의 말로 하지 아니하고 다만 성령의 나타나심과 능력으로 하여 너희 믿음이 사람의 지혜에 있지 아니하고 다만 하나님의 능력에 있게 하려 하였노라',
'고전3:16,17':'너희는 너희가 하나님의 성전인 것과 하나님의 성령이 너희 안에 계시는 것을 알지 못하느냐 누구든지 하나님의 성전을 더럽히면 하나님이 그 사람을 멸하시리라 하나님의 성전은 거룩하니 너희도 그러하니라',
'고전6:19,20':'너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희 자신의 것이 아니라 값으로 산 것이 되었으니 그런즉 너희 몸으로 하나님께 영광을 돌리라',
'롬8:1-2,5-8':'그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니 이는 그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라 육신을 따르는 자는 육신의 일을, 영을 따르는 자는 영의 일을 생각하나니 육신의 생각은 사망이요 영의 생각은 생명과 평안이니라 육신의 생각은 하나님과 원수가 되나니 이는 하나님의 법에 굴복하지 아니할 뿐 아니라 할 수도 없음이라 육신에 있는 자들은 하나님을 기쁘시게 할 수 없느니라',
'롬8:15-17':'너희는 다시 무서워하는 종의 영을 받지 아니하고 양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라 성령이 친히 우리의 영과 더불어 우리가 하나님의 자녀인 것을 증언하시나니 자녀이면 또한 상속자 곧 하나님의 상속자요 그리스도와 함께 한 상속자니 우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라',
'갈5:16,17,22-23':'내가 이르노니 너희는 성령을 따라 행하라 그리하면 육체의 욕심을 이루지 아니하리라 육체의 소욕은 성령을 거스르고 성령은 육체를 거스르나니 이 둘이 서로 대적함으로 너희가 원하는 것을 하지 못하게 하려 함이니라 오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라',
'엡5:16,18':'세월을 아끼라 때가 악하니라 술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라',
'엡5:18-21':'술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라 시와 찬송과 신령한 노래들로 서로 화답하며 너희의 마음으로 주께 노래하며 찬송하며 범사에 우리 주 예수 그리스도의 이름으로 항상 아버지 하나님께 감사하며 그리스도를 경외함으로 피차 복종하라',
'골3:16,17':'그리스도의 말씀이 너희 속에 풍성히 거하여 모든 지혜로 피차 가르치며 권면하고 시와 찬송과 신령한 노래를 부르며 감사하는 마음으로 하나님을 찬양하고 또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라',
'요7:37-39':'명절 끝날 곧 큰 날에 예수께서 서서 외쳐 이르시되 누구든지 목마르거든 내게로 와서 마시라 나를 믿는 자는 성경에 이름과 같이 그 배에서 생수의 강이 흘러나오리라 하시니 이는 그를 믿는 자들이 받을 성령을 가리켜 말씀하신 것이라 예수께서 아직 영광을 받지 않으셨으므로 성령이 아직 그들에게 계시지 아니하시더라',
'요14:16-18':'내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 영원토록 너희와 함께 있게 하리니 그는 진리의 영이라 세상은 능히 그를 받지 못하나니 이는 그를 보지도 못하고 알지도 못함이라 그러나 너희는 그를 아나니 그는 너희와 함께 거하심이요 또 너희 속에 계시겠음이라 내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라',
'요16:7,8,13-14':'그러나 내가 너희에게 실상을 말하노니 내가 떠나가는 것이 너희에게 유익이라 내가 떠나가지 아니하면 보혜사가 너희에게로 오시지 아니할 것이요 가면 내가 그를 너희에게로 보내리니 그가 와서 죄에 대하여, 의에 대하여, 심판에 대하여 세상을 책망하시리라 그러나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 내 것을 가지고 너희에게 알리시겠음이라',
'행4:18-20,31':'그들을 불러 경고하여 도무지 예수의 이름으로 말하지도 말고 가르치지도 말라 하니 베드로와 요한이 대답하여 이르되 하나님 앞에서 너희의 말을 듣는 것이 하나님의 말씀을 듣는 것보다 옳은가 판단하라 우리는 보고 들은 것을 말하지 아니할 수 없다 하니 빌기를 다하매 모인 곳이 진동하더니 무리가 다 성령이 충만하여 담대히 하나님의 말씀을 전하니라',
'행5:40-42':'그들이 옳게 여겨 사도들을 불러들여 채찍질하며 예수의 이름으로 말하는 것을 금하고 놓으니 사도들은 그 이름을 위하여 능욕 받는 일에 합당한 자로 여기심을 기뻐하면서 공회 앞을 떠나니라 그들이 날마다 성전에 있든지 집에 있든지 예수는 그리스도라고 가르치기와 전도하기를 그치지 아니하니라',
'행10:38':'하나님이 나사렛 예수에게 성령과 능력을 기름 붓듯 하셨으매 그가 두루 다니시며 선한 일을 행하시고 마귀에게 눌린 모든 사람을 고치셨으니 이는 하나님이 함께 하셨음이라',
'사61:1':'주 여호와의 영이 내게 내리셨으니 이는 여호와께서 내게 기름을 부으사 가난한 자에게 아름다운 소식을 전하게 하려 하심이라 나를 보내사 마음이 상한 자를 고치며 포로된 자에게 자유를, 갇힌 자에게 놓임을 선포하며',
'슥4:6,7':'그가 내게 대답하여 이르되 여호와께서 스룹바벨에게 하신 말씀이 이러하니라 만군의 여호와께서 말씀하시되 이는 힘으로 되지 아니하며 능력으로 되지 아니하고 오직 나의 영으로 되느니라 큰 산아 네가 무엇이냐 스룹바벨 앞에서 평지가 되리라 그가 머릿돌을 내놓을 때에 무리가 외치기를 은총, 은총이 그에게 있을지어다 하리라 하셨고',
'겔11:19,20':'내가 그들에게 한 마음을 주고 그 속에 새 영을 주며 그 몸에서 돌 같은 마음을 제거하고 살 같은 마음을 주어서 내 율례를 따르며 내 규례를 지켜 행하게 하리니 그들은 내 백성이 되고 나는 그들의 하나님이 되리라',
'겔36:26,27':'또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 돌 같은 마음을 제거하고 살 같은 마음을 줄 것이며 또 내 영을 너희 속에 두어 너희로 내 율례를 행하게 하리니 너희가 내 규례를 지켜 행할지라',
'겔37:5,6,10':'주 여호와께서 이 뼈들에게 이같이 말씀하시기를 내가 생기를 너희에게 들어가게 하리니 너희가 살아나리라 내가 너희 위에 힘줄을 두고 살을 입히고 가죽으로 덮고 너희 속에 생기를 넣으리니 너희가 살아나리라 또 내가 여호와인 줄 너희가 알리라 하셨다 하라 내가 그 명대로 대언하니 생기가 그들에게 들어가매 그들이 곧 살아나서 일어나 서는데 극히 큰 군대더라',
'겔47:1-12':'그가 나를 데리고 성전 문에 이르시니 성전의 앞면이 동쪽을 향하였는데 그 문지방 밑에서 물이 나와 동쪽으로 흐르다가 성전 오른쪽 제단 남쪽으로 흘러 내리더라 그 사람이 손에 줄을 잡고 동쪽으로 나아가며 천 척을 측량한 후에 나를 그 물 가운데로 건너게 하시니 물이 발목까지 오르더라 다시 천 척을 측량하고 나를 물 가운데로 건너게 하시니 물이 무릎까지 오르고 다시 천 척을 측량하고 나를 건너게 하시니 물이 허리까지 오르고 다시 천 척을 측량하시니 물이 내가 건너지 못할 강이 된지라 그 물이 가득하여 헤엄칠 만한 물이요 건너지 못할 강이더라 이 강이 이르는 곳마다 번성하는 모든 생물이 살고 또 고기가 심히 많으리니 이 물이 흘러 들어가므로 바닷물이 되살아나겠고 이 강이 이르는 곳마다 모든 것이 살 것이며 강 좌우 가에는 각종 먹을 과목나무가 자라서 그 잎이 시들지 아니하며 열매가 끊이지 아니하고 달마다 새 열매를 맺으리니 그 물이 성소를 통하여 나옴이라 그 열매는 먹을 만하고 그 잎사귀는 약 재료가 되리라',
/* SCL2 (그리스도와의 교제) — 제2과 그리스도의 주재권 */
'요13:13':'너희가 나를 선생이라 또는 주라 하니 너희 말이 옳도다 내가 그러하다',
'행10:36':'만유의 주 되신 예수 그리스도로 말미암아 화평의 복음을 전하사 이스라엘 자손들에게 보내신 말씀을 너희도 알거니와',
'계19:16':'그 옷과 그 다리에 이름을 쓴 것이 있으니 만왕의 왕이요 만주의 주라 하였더라',
'골1:16-17':'만물이 그에게서 창조되되 하늘과 땅에서 보이는 것들과 보이지 않는 것들과 혹은 왕권들이나 주권들이나 통치자들이나 권세들이나 만물이 다 그로 말미암고 그를 위하여 창조되었고 또한 그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라',
'롬14:9':'이를 위하여 그리스도께서 죽었다가 다시 살아나셨으니 곧 죽은 자와 산 자의 주가 되려 하심이라',

'계12:11':'또 우리 형제들이 어린 양의 피와 자기들이 증언하는 말씀으로써 그를 이겼으니 그들은 죽기까지 자기들의 생명을 아끼지 아니하였도다',
'계20:10':'또 그들을 미혹하는 마귀가 불과 유황 못에 던져지니 거기는 그 짐승과 거짓 선지자도 있어 세세토록 밤낮 괴로움을 받으리라',
'계20:12,15':'또 내가 보니 죽은 자들이 큰 자나 작은 자나 그 보좌 앞에 서 있는데 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니 … 누구든지 생명책에 기록되지 못한 자는 불못에 던져지더라',
'계21:4':'모든 눈물을 그 눈에서 닦아 주시니 다시는 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라',
'계22:12':'보라 내가 속히 오리니 내가 줄 상이 내게 있어 각 사람에게 그가 행한 대로 갚아 주리라',
'고전1:23-24':'우리는 십자가에 못 박힌 그리스도를 전하니 유대인에게는 거리끼는 것이요 이방인에게는 미련한 것이로되 오직 부르심을 받은 자들에게는 유대인이나 헬라인이나 그리스도는 하나님의 능력이요 하나님의 지혜니라',
'고전2:4':'내 말과 내 전도함이 설득력 있는 지혜의 말로 하지 아니하고 다만 성령의 나타나심과 능력으로 하여',
'고전2:12':'우리가 세상의 영을 받지 아니하고 오직 하나님으로부터 온 영을 받았으니 이는 우리로 하여금 하나님께서 우리에게 은혜로 주신 것들을 알게 하려 하심이라',
'고전2:12-14':'우리가 세상의 영을 받지 아니하고 오직 하나님으로부터 온 영을 받았으니 이는 우리로 하여금 하나님께서 우리에게 은혜로 주신 것들을 알게 하려 하심이라 우리가 이것을 말하거니와 사람의 지혜가 가르친 말로 아니하고 오직 성령께서 가르치신 것으로 하니 영적인 일은 영적인 것으로 분별하느니라 육에 속한 사람은 하나님의 성령의 일들을 받지 아니하나니 이는 그것들이 그에게는 어리석게 보임이요 또 그는 그것들을 알 수도 없나니 그러한 일은 영적으로 분별되기 때문이라',
'고전2:13-14':'우리가 이것을 말하거니와 사람의 지혜가 가르친 말로 아니하고 오직 성령께서 가르치신 것으로 하니 영적인 일은 영적인 것으로 분별하느니라 육에 속한 사람은 하나님의 성령의 일들을 받지 아니하나니 이는 그것들이 그에게는 어리석게 보임이요 또 그는 그것들을 알 수도 없나니 그러한 일은 영적으로 분별되기 때문이라',
'고전3:16':'너희는 너희가 하나님의 성전인 것과 하나님의 성령이 너희 안에 계시는 것을 알지 못하느냐',
'고전4:5':'그러므로 때가 이르기 전 곧 주께서 오시기까지 아무것도 판단하지 말라 그가 어둠에 감추인 것들을 드러내고 마음의 뜻을 나타내시리니 그 때에 각 사람에게 하나님으로부터 칭찬이 있으리라',
'고전4:14':'내가 너희를 부끄럽게 하려고 이것을 쓰는 것이 아니라 오직 너희를 내 사랑하는 자녀같이 권하려 하는 것이라',
'고전4:15':'그리스도 안에서 일만 스승이 있으되 아버지는 많지 아니하니 그리스도 예수 안에서 복음으로써 내가 너희를 낳았음이라',
'고전4:17':'이로 인하여 내가 주 안에서 내 사랑하고 신실한 아들 디모데를 너희에게 보내었노니 그가 그리스도 예수 안에서 나의 행사 곧 내가 각처 각 교회에서 가르치는 것을 너희로 생각나게 하리라',
'고전6:11':'너희 중에 이와 같은 자들이 있더니 주 예수 그리스도의 이름과 우리 하나님의 성령 안에서 씻음과 거룩함과 의롭다 하심을 받았느니라',
'고전6:19':'너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희 자신의 것이 아니라',
'고전9:11,14':'우리가 너희에게 신령한 것을 뿌렸은즉 너희의 육신의 것을 거두기로서니 지나치다 하겠느냐 … 이와 같이 주께서도 복음 전하는 자들이 복음으로 말미암아 살리라 명하셨느니라',
'고전10:31':'그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라',
'고전10:33':'나와 같이 모든 일에 모든 사람을 기쁘게 하여 자신의 유익을 구하지 아니하고 많은 사람의 유익을 구하여 그들로 구원을 받게 하라',
'고전12:3':'그러므로 내가 너희에게 알리노니 하나님의 영으로 말하는 자는 누구든지 예수를 저주할 자라 하지 아니하고 또 성령으로 아니하고는 누구든지 예수를 주시라 할 수 없느니라',
'고전12:7-11':'각 사람에게 성령을 나타내심은 유익하게 하려 하심이라 어떤 사람에게는 성령으로 말미암아 지혜의 말씀을, 어떤 사람에게는 같은 성령을 따라 지식의 말씀을, 다른 사람에게는 같은 성령으로 믿음을, 어떤 사람에게는 한 성령으로 병 고치는 은사를, 어떤 사람에게는 능력 행함을, 어떤 사람에게는 예언함을, 어떤 사람에게는 영들 분별함을, 다른 사람에게는 각종 방언 말함을, 어떤 사람에게는 방언들 통역함을 주시나니 이 모든 일은 같은 한 성령이 행하사 그의 뜻대로 각 사람에게 나누어 주시느니라',
'고전12:13':'우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 다 한 성령을 마시게 하셨느니라',
'고전15:3-4':'내가 받은 것을 먼저 너희에게 전하였노니 이는 성경대로 그리스도께서 우리 죄를 위하여 죽으시고 장사 지낸 바 되셨다가 성경대로 사흘 만에 다시 살아나사',
'고전15:22-23':'아담 안에서 모든 사람이 죽은 것 같이 그리스도 안에서 모든 사람이 삶을 얻으리라 그러나 각각 자기 차례대로 되리니 먼저는 첫 열매인 그리스도요 다음에는 그가 강림하실 때에 그리스도에게 속한 자요',
'고전15:35-38':'누군가가 묻기를 죽은 자들이 어떻게 다시 살아나며 어떠한 몸으로 오느냐 하리니 어리석은 자여 네가 뿌리는 씨가 죽지 않으면 살아나지 못하겠고 또 네가 뿌리는 것은 장래의 형체를 뿌리는 것이 아니요 다만 밀이나 다른 것의 알갱이뿐이로되 하나님이 그 뜻대로 그에게 형체를 주시되 각 종류대로 그 씨에게 형체를 주시느니라',
'고전15:42-44':'죽은 자의 부활도 그와 같으니 썩을 것으로 심고 썩지 아니할 것으로 다시 살아나며 욕된 것으로 심고 영광스러운 것으로 다시 살아나며 약한 것으로 심고 강한 것으로 다시 살아나며 육의 몸으로 심고 신령한 몸으로 다시 살아나나니 육의 몸이 있은즉 또 영의 몸도 있느니라',
'고전16:2':'매주 첫날에 너희 각 사람이 수입에 따라 모아 두어서 내가 갈 때에 연보를 하지 않게 하라',
// ── 고후, 골, 눅 ──
'고후2:14':'항상 우리를 그리스도 안에서 이기게 하시고 우리로 말미암아 각처에서 그리스도를 아는 냄새를 나타내시는 하나님께 감사하노라',
'고후4:3-4':'만일 우리의 복음이 가리었으면 망하는 자들에게 가리어진 것이라 그 중에 이 세상의 신이 믿지 아니하는 자들의 마음을 혼미하게 하여 그리스도의 영광의 복음의 광채가 비치지 못하게 함이니 그리스도는 하나님의 형상이니라',
'고후4:4':'그 중에 이 세상의 신이 믿지 아니하는 자들의 마음을 혼미하게 하여 그리스도의 영광의 복음의 광채가 비치지 못하게 함이니 그리스도는 하나님의 형상이니라',
'고후5:10':'이는 우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어 각각 선악 간에 그 몸으로 행한 것을 따라 받으려 함이라',
'고후5:19-20':'곧 하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며 그들의 죄를 그들에게 돌리지 아니하시고 화목하게 하는 말씀을 우리에게 맡기셨느니라 그러므로 우리가 그리스도를 대신하여 사신이 되어 하나님이 우리를 통하여 너희를 권면하시는 것 같이 그리스도를 대신하여 간청하노니 너희는 하나님과 화목하라',
'고후8:9':'우리 주 예수 그리스도의 은혜를 너희가 알거니와 부요하신 이로서 너희를 위하여 가난하게 되심은 그의 가난함으로 말미암아 너희를 부요하게 하려 하심이라',
'고후9:6':'이것이 곧 적게 심는 자는 적게 거두고 많이 심는 자는 많이 거둔다 하는 말이로다',
'고후9:7':'각각 그 마음에 정한 대로 할 것이요 인색함으로나 억지로 하지 말지니 하나님은 즐겨 내는 자를 사랑하시느니라',
'고후9:8':'하나님이 능히 모든 은혜를 너희에게 넘치게 하시나니 이는 너희로 모든 일에 항상 모든 것이 넉넉하여 모든 착한 일을 넘치게 하게 하려 하심이라',
'고후11:3':'뱀이 그 간계로 하와를 미혹한 것 같이 너희 마음이 그리스도를 향하는 진실함과 깨끗함에서 떠나 부패할까 두려워하노라',
'고후11:14':'이것은 이상한 일이 아니니라 사탄도 자기를 광명의 천사로 가장하나니',
'고후12:20-21':'내가 갈 때에 너희를 내가 원하는 것과 같지 않음을 보고 나도 너희가 원하지 않는 것과 같이 있을까 봐 두렵고 또 다툼과 시기와 분냄과 당 짓는 것과 비방과 수군수군함과 거만함과 어지러운 것이 있을까 두렵고 또 내가 다시 올 때에 내 하나님이 너희 앞에서 나를 낮추실까 두렵고 또 전에 죄를 지은 여러 사람 곧 더럽고 음란하고 호색한 일을 하고 회개하지 아니한 자들을 인하여 슬퍼할까 두려워하노라',
'골1:28':'우리가 그를 전파하여 각 사람을 권하고 모든 지혜로 각 사람을 가르침은 각 사람을 그리스도 안에서 완전한 자로 세우려 함이니',
'골2:7':'그 안에 뿌리를 박으며 세움을 받아 교훈을 받은 대로 믿음에 굳게 서서 감사함을 넘치게 하라',
'골3:1-2,5':'그러므로 너희가 그리스도와 함께 다시 살리심을 받았으면 위의 것을 찾으라 거기는 그리스도께서 하나님 우편에 앉아 계시느니라 위의 것을 생각하고 땅의 것을 생각하지 말라 … 그러므로 땅에 있는 지체를 죽이라 곧 음란과 부정과 사욕과 악한 정욕과 탐심이니 탐심은 우상 숭배니라',
'골4:12':'너희에게서 온 에바브라가 너희에게 문안하느니라 그는 그리스도 예수의 종이니 항상 너희를 위하여 애써 기도하여 너희로 하나님의 모든 뜻 가운데서 완전하고 확신있게 서기를 구하느니라',
'눅5:15-16':'예수의 소문이 더욱 퍼지매 허다한 무리가 말씀도 듣고 자기 병도 고침을 받고자 하여 모여 오되 예수는 물러가사 한적한 곳에서 기도하시니라',
'눅6:12':'이 때에 예수께서 기도하시러 산으로 가사 밤이 새도록 하나님께 기도하시고',
'눅6:38':'주라 그리하면 너희에게 줄 것이니 곧 후히 되어 누르고 흔들어 넘치도록 하여 너희에게 안겨 주리라 너희가 헤아리는 그 헤아림으로 너희도 헤아림을 도로 받을 것이니라',
'눅8:12':'길 가에 있다는 것은 말씀을 들은 자니 이에 마귀가 와서 그들이 믿어 구원을 얻지 못하게 하려고 말씀을 그 마음에서 빼앗는 것이요',
'눅11:5-10':'또 이르시되 너희 중에 누가 벗이 있는데 밤중에 그에게 가서 말하기를 벗이여 떡 세 덩이를 내게 빌려 달라 내 벗이 여행 중에 내게 왔으나 내가 먹일 것이 없노라 하면 그가 안에서 대답하여 이르되 나를 괴롭게 하지 말라 문이 이미 닫혔고 아이들이 나와 함께 침실에 누웠으니 일어나 네게 줄 수가 없노라 하겠느냐 내가 너희에게 말하노니 비록 벗됨으로 인하여서는 일어나서 주지 아니할지라도 그 간청함을 인하여 일어나 그 요구대로 주리라 내가 또 너희에게 이르노니 구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾아낼 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니 구하는 이마다 받을 것이요 찾는 이마다 찾아낼 것이요 두드리는 이에게는 열릴 것이니라',
'눅12:15-21':'그들에게 이르시되 삼가 모든 탐심을 물리치라 사람의 생명이 그 소유의 넉넉한 데 있지 아니하니라 하시고 또 비유로 그들에게 말씀하여 이르시되 한 부자가 그 밭에 소출이 풍성하매 심중에 생각하여 이르되 내가 곡식 쌓아 둘 곳이 없으니 어찌할까 하고 또 이르되 내가 이렇게 하리라 내 곳간을 헐고 더 크게 짓고 내 모든 곡식과 물건을 거기 쌓아 두리라 또 내가 내 영혼에게 이르되 영혼아 여러 해 쓸 물건을 많이 쌓아 두었으니 평안히 쉬고 먹고 마시고 즐거워하자 하리라 하되 하나님은 이르시되 어리석은 자여 오늘 밤에 네 영혼을 도로 찾으리니 그러면 네 준비한 것이 누구의 것이 되겠느냐 하셨으니 자기를 위하여 재물을 쌓아 두고 하나님께 대하여 부요하지 못한 자가 이와 같으니라',
'눅12:40':'그러므로 너희도 준비하고 있으라 생각하지 않은 때에 인자가 오리라',
'눅16:23-24':'그가 음부에서 고통 중에 눈을 들어 멀리 아브라함과 그의 품에 있는 나사로를 보고 불러 이르되 아버지 아브라함이여 나를 긍휼히 여기사 나사로를 보내어 그 손가락 끝에 물을 찍어 내 혀를 서늘하게 하소서 내가 이 불꽃 가운데서 괴로워하나이다',
'눅18:1':'예수께서 그들에게 항상 기도하고 낙심하지 말아야 할 것을 비유로 말씀하여',
'눅18:9-14':'또 자기를 의롭다고 믿고 다른 사람을 멸시하는 자들에게 이 비유로 말씀하시되 두 사람이 기도하러 성전에 올라가니 하나는 바리새인이요 하나는 세리라 바리새인은 서서 따로 기도하여 이르되 하나님이여 나는 다른 사람들 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고 다만 가슴을 치며 이르되 하나님이여 불쌍히 여기소서 나는 죄인이로소이다 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라 하시니라',
'눅19:8':'삭개오가 서서 주께 여짜오되 주여 보시옵소서 내 소유의 절반을 가난한 자들에게 주겠사오며 만일 누구의 것을 속여 빼앗은 일이 있으면 네 갑절이나 갚겠나이다',
'눅23:33-34':'해골이라 하는 곳에 이르러 거기서 예수를 십자가에 못 박고 두 행악자도 그렇게 하니 하나는 우편에, 하나는 좌편에 있더라 이에 예수께서 이르시되 아버지 저들을 사하여 주옵소서 자기들이 하는 것을 알지 못함이니이다 하시더라',
'눅24:45':'이에 그들의 마음을 열어 성경을 깨닫게 하시고',
// ── 단, 대상, 대하, 딛, 딤전, 딤후, 레, 렘 ──
'단6:1-10':'다리오가 뜻을 세워 온 나라를 다스리기 위하여 고관 백이십 명을 세우고 또 그들 위에 총리 셋을 세웠으니 다니엘이 그 중의 하나이라 이 다니엘은 마음이 민첩하여 총리들과 고관들 위에 뛰어나므로 왕이 그를 세워 전국을 다스리게 하려 하였더니 이에 총리들과 고관들이 국사에 대하여 다니엘을 고발할 근거를 찾으려 하였으나 아무 근거, 아무 허물도 찾지 못하였으니 이는 그가 충성되어 아무 그릇됨도 없고 아무 허물도 없음이었더라 그 사람들이 이르되 이 다니엘은 그의 하나님의 율법에서 근거를 찾지 못하면 그를 고발할 수 없으리라 하고 … 다니엘이 이 조서에 왕의 도장이 찍힌 것을 알고도 자기 집에 돌아가서는 윗방에 올라가 예루살렘으로 향한 창문을 열고 전에 행하던 대로 하루 세 번씩 무릎을 꿇고 기도하며 그의 하나님께 감사하였더라',
'대상28:9':'내 아들 솔로몬아 너는 네 아버지의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길지어다 여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니 네가 그를 찾으면 만날 것이요 버리면 그가 너를 영원히 버리시리라',
'대상29:10-13':'다윗이 온 회중 앞에서 여호와를 송축하여 이르되 우리 조상 이스라엘의 하나님 여호와여 주는 영원부터 영원까지 송축을 받으시옵소서 여호와여 위대하심과 권능과 영광과 승리와 위엄이 다 주께 속하였사오니 천지에 있는 것이 다 주의 것이로소이다 여호와여 주권도 주께 속하였사오니 주는 높으사 만물의 머리이심이니이다 부와 귀가 주께로 말미암고 또 주는 만물의 주재가 되사 손에 권세와 능력이 있사오니 모든 사람을 크게 하심과 강하게 하심이 주의 손에 있나이다 우리 하나님이여 이제 우리가 주께 감사하오며 주의 영화로운 이름을 찬양하나이다',
'대상29:12':'부와 귀가 주께로 말미암고 또 주는 만물의 주재가 되사 손에 권세와 능력이 있사오니 모든 사람을 크게 하심과 강하게 하심이 주의 손에 있나이다',
'대하7:14':'내 이름으로 일컫는 내 백성이 그들의 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 찾으면 내가 하늘에서 듣고 그들의 죄를 사하고 그들의 땅을 고칠지라',
'딛1:9':'미쁜 말씀의 가르침을 그대로 지켜야 하리니 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라',
'딛2:7-8':'너는 범사에 네 자신이 선한 일의 본을 보이며 교훈에 부패하지 아니함과 단정함과 책망할 것이 없는 바른 말을 하게 하라 이는 대적하는 자로 하여금 부끄러워 우리를 악하다 할 것이 없게 하려 함이라',
'딤전1:17':'만세의 왕 곧 썩지 아니하고 보이지 아니하고 홀로 하나이신 하나님께 존귀와 영광이 세세토록 있을지어다 아멘',
'딤전2:1,3-4':'그러므로 내가 첫째로 권하노니 모든 사람을 위하여 간구와 기도와 도고와 감사를 하되 … 이것이 우리 구주 하나님 앞에 선하고 받으실 만한 것이니 하나님은 모든 사람이 구원을 받으며 진리를 아는 데에 이르기를 원하시느니라',
'딤전2:5':'하나님은 한 분이시요 또 하나님과 사람 사이에 중보자도 한 분이시니 곧 사람이신 그리스도 예수라',
'딤전2:5-6':'하나님은 한 분이시요 또 하나님과 사람 사이에 중보자도 한 분이시니 곧 사람이신 그리스도 예수라 그가 모든 사람을 위하여 자기를 대속물로 주셨으니 기약이 이르면 증언될 것이라',
'딤전2:8':'그러므로 각처에서 남자들이 분노와 다툼이 없이 거룩한 손을 들어 기도하기를 원하노라',
'딤전4:12':'누구든지 네 연소함을 업신여기지 못하게 하고 오직 말과 행실과 사랑과 믿음과 정절에 있어서 믿는 자에게 본이 되어',
'딤전6:9-10':'부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라 돈을 사랑함이 일만 악의 뿌리가 되나니 이것을 탐내는 자들은 미혹을 받아 믿음에서 떠나 많은 근심으로써 자기를 찔렀도다',
'딤후1:3':'나는 밤낮 간구하는 가운데 쉬지 않고 너를 생각하여 청결한 양심으로 조상 때부터 섬겨 온 하나님께 감사하고',
'딤후2:2':'또 네가 많은 증인 앞에서 내게 들은 바를 충성된 사람들에게 부탁하라 그들이 또 다른 사람들을 가르칠 수 있으리라',
'딤후2:15':'너는 진리의 말씀을 옳게 분별하며 부끄러울 것이 없는 일꾼으로 인정된 자로 자신을 하나님 앞에 드리기를 힘쓰라',
'딤후3:1-5':'너는 이것을 알라 말세에 고통하는 때가 이르리라 사람들이 자기를 사랑하며 돈을 사랑하며 자랑하며 교만하며 비방하며 부모를 거역하며 감사하지 아니하며 거룩하지 아니하며 무정하며 원통함을 풀지 아니하며 모함하며 절제하지 못하며 사나우며 선한 것을 좋아하지 아니하며 배신하며 조급하며 자만하며 쾌락을 사랑하기를 하나님 사랑하는 것보다 더하며 경건의 모양은 있으나 경건의 능력은 부인하니 이같은 자들에게서 네가 돌아서라',
'딤후3:7':'항상 배우나 마침내 진리의 지식에 이를 수 없느니라',
'딤후4:1-2':'하나님 앞과 살아 있는 자와 죽은 자를 심판하실 그리스도 예수 앞에서 그가 나타나실 것과 그의 나라를 두고 엄히 명하노니 너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 경책하며 경계하며 권하라',
'딤후4:8':'이제 후로는 나를 위하여 의의 면류관이 예비되었으므로 주 곧 의로우신 재판장이 그 날에 내게 주실 것이며 내게만 아니라 주의 나타나심을 사모하는 모든 자에게도니라',
'레20:26':'너희는 나에게 거룩할지어다 이는 나 여호와가 거룩하고 내가 또 너희를 나의 소유로 삼으려고 너희를 만민 중에서 구별하였음이니라',
'렘7:23':'오직 내가 이것으로 그들에게 명령하여 이르기를 너희는 내 목소리를 들으라 그리하면 나는 너희 하나님이 되겠고 너희는 내 백성이 되리라 너희는 내가 명령하는 모든 길로 걸어가라 그리하면 복을 받으리라 하였으나',
'렘9:23-24':'여호와께서 이와 같이 말씀하시되 지혜로운 자는 그의 지혜를 자랑하지 말라 용사는 그의 용맹을 자랑하지 말라 부자는 그의 부함을 자랑하지 말라 자랑하는 자는 이것으로 자랑할지니 곧 명철하여 나를 아는 것과 나 여호와는 사랑과 정의와 공의를 땅에 행하는 자인 줄 깨닫는 것이라 나는 이 일을 기뻐하노라 여호와의 말씀이니라',
'렘10:10':'오직 여호와는 참 하나님이시요 살아 계신 하나님이시요 영원한 왕이시라 그의 진노하심에 땅이 진동하며 그의 분노하심을 이방이 능히 당하지 못하느니라',
'렘17:9':'만물보다 거짓되고 심히 부패한 것은 마음이라 누가 능히 이를 알리요마는',
'렘23:24':'여호와의 말씀이니라 사람이 내게 보이지 아니하려고 누가 능히 자신을 은밀한 곳에 숨길 수 있겠느냐 나 여호와가 말하노라 나는 하늘과 땅에 충만하지 아니하냐',
'렘31:3':'여호와께서 옛적에 나에게 나타나사 이르시되 내가 영원한 사랑으로 너를 사랑하기에 인자함으로 너를 이끌었다 하셨느니라',
'렘32:17':'슬프도소이다 주 여호와여 주께서 큰 능력과 펴신 팔로 천지를 만드셨사오니 주에게는 할 수 없는 일이 없으시니이다',
// ── 롬 ──
'롬1:8':'먼저 내가 예수 그리스도로 말미암아 너희 모든 사람에 관하여 내 하나님께 감사함은 너희 믿음이 온 세상에 전파됨이로다',
'롬1:18':'하나님의 진노가 불의로 진리를 막는 사람들의 모든 경건하지 않음과 불의에 대하여 하늘로부터 나타나나니',
'롬1:19-20':'이는 하나님을 알 만한 것이 그들 속에 보임이라 하나님께서 이를 그들에게 보이셨느니라 창세로부터 그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성이 그가 만드신 만물에 분명히 보여 알려졌나니 그러므로 그들이 핑계하지 못할지니라',
'롬2:8-11':'오직 당을 지어 진리를 따르지 아니하고 불의를 따르는 자에게는 진노와 분노로 하시리라 악을 행하는 각 사람의 영에는 환난과 곤고가 있으리니 먼저는 유대인에게요 그리고 헬라인에게며 선을 행하는 각 사람에게는 영광과 존귀와 평강이 있으리니 먼저는 유대인에게요 그리고 헬라인에게라 이는 하나님께서 외모로 사람을 취하지 아니하심이라',
'롬2:15':'이런 이들은 그 양심이 증거가 되어 그 생각들이 서로 혹은 고발하며 혹은 변명하여 그 마음에 새긴 율법의 행위를 나타내느니라',
'롬3:9-12':'그러면 어떠하냐 우리는 나으냐 결코 아니라 유대인이나 헬라인이나 다 죄 아래에 있다고 우리가 이미 선언하였느니라 기록된 바 의인은 없나니 하나도 없으며 깨닫는 자도 없고 하나님을 찾는 자도 없고 다 치우쳐 함께 무익하게 되고 선을 행하는 자는 없나니 하나도 없도다',
'롬3:12':'다 치우쳐 함께 무익하게 되고 선을 행하는 자는 없나니 하나도 없도다',
'롬3:14-18':'그 입에는 저주와 악독이 가득하고 그 발은 피 흘리는 데 빠른지라 파멸과 고생이 그 길에 있어 평강의 길을 알지 못하였고 그들의 눈 앞에 하나님을 두려워함이 없느니라',
'롬4:5-8':'일을 아니할지라도 경건하지 아니한 자를 의롭다 하시는 이를 믿는 자에게는 그의 믿음을 의로 여기시나니 일한 것이 없이 하나님께 의로 여기심을 받는 사람의 복에 대하여 다윗이 말한 바 불법이 사함을 받고 죄가 가리어짐을 받는 사람들은 복이 있고 주께서 그 죄를 인정하지 아니하실 사람은 복이 있도다 함과 같으니라',
'롬5:5':'소망이 우리를 부끄럽게 하지 아니함은 우리에게 주신 성령으로 말미암아 하나님의 사랑이 우리 마음에 부은 바 됨이니',
'롬5:8':'우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라',
'롬5:8-9':'우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라 그러면 이제 우리가 그의 피로 말미암아 의롭다 하심을 받았으니 더욱 그로 말미암아 진노하심에서 구원을 받을 것이니',
'롬6:17-18':'하나님께 감사하리로다 너희가 본래 죄의 종이더니 너희에게 전하여 준 바 교훈의 본을 마음으로 순종하여 죄로부터 해방되어 의에게 종이 되었느니라',
'롬6:23':'죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라',
'롬8:1':'그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니',
'롬8:14':'무릇 하나님의 영으로 인도함을 받는 사람은 곧 하나님의 아들이라',
'롬8:16':'성령이 친히 우리의 영과 더불어 우리가 하나님의 자녀인 것을 증언하시나니',
'롬8:26':'이와 같이 성령도 우리의 연약함을 도우시나니 우리는 마땅히 기도할 바를 알지 못하나 오직 성령이 말할 수 없는 탄식으로 우리를 위하여 친히 간구하시느니라',
'롬8:34':'누가 정죄하리요 죽으실 뿐 아니라 다시 살아나신 이는 그리스도 예수시니 그는 하나님 우편에 계신 자요 우리를 위하여 간구하시는 자시니라',
'롬8:38-39':'내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나 높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라',
'롬10:1':'형제들아 내 마음에 원하는 바와 하나님께 구하는 바는 이스라엘을 위함이니 곧 그들로 구원을 받게 함이라',
'롬12:6-8':'우리에게 주신 은혜대로 받은 은사가 각각 다르니 혹 예언이면 믿음의 분수대로, 혹 섬기는 일이면 섬기는 일로, 혹 가르치는 자면 가르치는 일로, 혹 위로하는 자면 위로하는 일로, 구제하는 자는 성실함으로, 다스리는 자는 부지런함으로, 긍휼을 베푸는 자는 즐거움으로 할 것이니라',
'롬14:12':'이러므로 우리 각 사람이 자기 일을 하나님께 직고하리라',
'롬15:20-21':'또 내가 그리스도의 이름을 부르는 곳에는 복음을 전하지 않기를 힘썼노니 이는 남의 터 위에 건축하지 아니하려 함이라 기록된 바 주의 소식을 받지 못한 자들이 볼 것이요 듣지 못한 자들이 깨달으리라 함과 같으니라',

'마4:3':'시험하는 자가 예수께 나아와서 이르되 네가 만일 하나님의 아들이어든 명하여 이 돌들로 떡덩이가 되게 하라',
'마5:23-24':'그러므로 예물을 제단에 드리려다가 거기서 네 형제에게 원망들을 만한 일이 있는 것이 생각나거든 예물을 제단 앞에 두고 먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라',
'마5:48':'그러므로 하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라',
'마6:1':'사람에게 보이려고 그들 앞에서 너희 의를 행하지 않도록 주의하라 그리하지 아니하면 하늘에 계신 너희 아버지께 상을 받지 못하느니라',
'마6:1-4':'사람에게 보이려고 그들 앞에서 너희 의를 행하지 않도록 주의하라 그리하지 아니하면 하늘에 계신 너희 아버지께 상을 받지 못하느니라 그러므로 구제할 때에 외식하는 자가 사람에게서 영광을 받으려고 회당과 거리에서 하는 것 같이 너희 앞에 나팔을 불지 말라 진실로 너희에게 이르노니 그들은 자기 상을 이미 받았느니라 너는 구제할 때에 오른손이 하는 것을 왼손이 모르게 하여 네 구제함을 은밀하게 하라 은밀한 중에 보시는 너의 아버지께서 갚으시리라',
'마6:13':'우리를 시험에 들게 하지 마시옵고 다만 악에서 구하시옵소서 나라와 권세와 영광이 아버지께 영원히 있사옵나이다 아멘',
'마6:20':'오직 너희를 위하여 보물을 하늘에 쌓아 두라 거기는 좀이나 동록이 해하지 못하며 도둑이 구멍을 뚫지도 못하고 도둑질도 못하느니라',
'마6:31-33':'그러므로 염려하여 이르기를 무엇을 먹을까 무엇을 마실까 무엇을 입을까 하지 말라 이는 다 이방인들이 구하는 것이라 너희 하늘 아버지께서 이 모든 것이 너희에게 있어야 할 줄을 아시느니라 그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라',
'마6:32':'이는 다 이방인들이 구하는 것이라 너희 하늘 아버지께서 이 모든 것이 너희에게 있어야 할 줄을 아시느니라',
'마9:10-12':'예수께서 마태의 집에서 앉아 음식을 잡수실 때에 많은 세리와 죄인들이 와서 예수와 그의 제자들과 함께 앉았더니 바리새인들이 보고 그의 제자들에게 이르되 어찌하여 너희 선생은 세리와 죄인들과 함께 잡수시느냐 예수께서 들으시고 이르시되 건강한 자에게는 의원이 쓸 데 없고 병든 자에게라야 쓸 데 있느니라',
'마9:34':'바리새인들은 이르되 그가 귀신의 왕을 의지하여 귀신을 쫓아낸다 하더라',
'마9:36-38':'무리를 보시고 불쌍히 여기시니 이는 그들이 목자 없는 양과 같이 고생하며 기진함이라 이에 제자들에게 이르시되 추수할 것은 많되 일꾼이 적으니 그러므로 추수하는 주인에게 청하여 추수할 일꾼들을 보내 주소서 하라 하시니라',
'마16:27':'인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 각 사람이 행한 대로 갚으리라',
'마18:15':'네 형제가 죄를 범하거든 가서 너와 그 사람과만 상대하여 권고하라 만일 들으면 네가 네 형제를 얻은 것이요',
'마19:16-22':'어떤 사람이 주께 와서 이르되 선생님이여 내가 무슨 선한 일을 하여야 영생을 얻으리이까 예수께서 이르시되 어찌하여 선한 일을 내게 묻느냐 선한 이는 오직 한 분이시니라 네가 생명에 들어가려면 계명들을 지키라 이르되 어느 계명이오니이까 예수께서 이르시되 살인하지 말라, 간음하지 말라, 도둑질하지 말라, 거짓 증언 하지 말라, 네 부모를 공경하라, 네 이웃을 네 자신과 같이 사랑하라 하신 것이니라 그 청년이 이르되 이 모든 것을 내가 지키었사오니 아직도 무엇이 부족하니이까 예수께서 이르시되 네가 온전하고자 할진대 가서 네 소유를 팔아 가난한 자들에게 주라 그리하면 하늘에서 보화가 네게 있으리라 그리고 와서 나를 따르라 하시니 그 청년이 재물이 많으므로 이 말씀을 듣고 근심하며 가니라',
'마19:26':'예수께서 그들을 보시며 이르시되 사람으로는 할 수 없으나 하나님으로서는 다 하실 수 있느니라',
'마23:12':'누구든지 자기를 높이는 자는 낮아지고 누구든지 자기를 낮추는 자는 높아지리라',

'마24:27':'번개가 동편에서 나서 서편까지 번쩍임 같이 인자의 임함도 그러하리라',
'마24:36,42-43':'그러나 그 날과 그 때는 아무도 모르나니 하늘의 천사들도, 아들도 모르고 오직 아버지만 아시느니라 … 그러므로 깨어 있으라 어느 날에 너희 주가 임할는지 너희가 알지 못함이니라 너희도 아는 바니 만일 집 주인이 도둑이 어느 시각에 올 줄을 알았더라면 깨어 있어 그 집을 뚫지 못하게 하였으리라',
'마24:37':'노아의 때와 같이 인자의 임함도 그러하리라',
'마26:42':'다시 두 번째 나아가 기도하여 이르시되 내 아버지여 만일 내가 마시지 않고는 이 잔이 내게서 지나갈 수 없거든 아버지의 원대로 되기를 원하나이다 하시고',
'마28:18-20':'예수께서 나아와 말씀하여 이르시되 하늘과 땅의 모든 권세를 내게 주셨으니 그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라',
'마28:19-20':'그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라',

'막7:20-21':'또 이르시되 사람에게서 나오는 그것이 사람을 더럽게 하느니라 속에서 곧 사람의 마음에서 나오는 것은 악한 생각 곧 음란과 도둑질과 살인과',
'막9:43,47-48':'만일 네 손이 너를 범죄하게 하거든 찍어버리라 장애인으로 영생에 들어가는 것이 두 손을 가지고 지옥 곧 꺼지지 않는 불에 들어가는 것보다 나으니라 … 만일 네 눈이 너를 범죄하게 하거든 빼버리라 한 눈으로 하나님의 나라에 들어가는 것이 두 눈을 가지고 지옥에 던져지는 것보다 나으니라 거기에는 구더기도 죽지 않고 불도 꺼지지 아니하느니라',
'막12:41-44':'예수께서 헌금함을 대하여 앉으사 무리가 어떻게 헌금함에 돈 넣는가를 보실새 여러 부자는 많이 넣는데 한 가난한 과부는 와서 두 렙돈 곧 한 고드란트를 넣는지라 예수께서 제자들을 불러다가 이르시되 내가 진실로 너희에게 이르노니 이 가난한 과부는 헌금함에 넣는 모든 사람보다 많이 넣었도다 그들은 다 그 풍족한 중에서 넣었거니와 이 과부는 그 가난한 중에서 자기의 모든 소유 곧 생활비 전부를 넣었느니라 하시니라',
'막13:35-37':'그러므로 깨어 있으라 집 주인이 언제 올는지 혹 저물 때일는지, 밤중일는지, 닭 울 때일는지, 새벽일는지 너희가 알지 못함이라 그가 갑자기 와서 너희가 자는 것을 보지 않도록 하라 깨어 있으라 내가 너희에게 하는 이 말은 모든 사람에게 하는 말이니라 하시니라',
'막14:38':'시험에 들지 않게 깨어 기도하라 마음에는 원이로되 육신이 약하도다 하시고',
'말3:6':'나 여호와는 변하지 아니하나니 그러므로 야곱의 자손들아 너희가 소멸되지 아니하느니라',

'벧전1:7':'너희 믿음의 확실함은 불로 연단하여도 없어질 금보다 더 귀하여 예수 그리스도께서 나타나실 때에 칭찬과 영광과 존귀를 얻게 할 것이니라',
'벧전1:13':'그러므로 너희 마음의 허리를 동이고 근신하여 예수 그리스도께서 나타나실 때에 너희에게 가져다 주실 은혜를 온전히 바랄지어다',
'벧전2:11':'사랑하는 자들아 거류민과 나그네 같은 너희를 권하노니 영혼을 거슬러 싸우는 육체의 정욕을 제어하라',
'벧전2:24':'친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니 이는 우리로 죄에 대하여 죽고 의에 대하여 살게 하려 하심이라 그가 채찍에 맞음으로 너희는 나음을 얻었나니',
'벧전4:10':'각각 은사를 받은 대로 하나님의 여러 가지 은혜를 맡은 선한 청지기 같이 서로 봉사하라',
'벧전5:8':'근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니',
'벧전5:8-9':'근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니 너희는 믿음을 굳건하게 하여 그를 대적하라 이는 세상에 있는 너희 형제들도 동일한 고난을 당하는 줄을 앎이라',
'벧후3:3-4':'먼저 이것을 알지니 말세에 조롱하는 자들이 와서 자기의 정욕을 따라 행하며 조롱하여 이르되 주께서 강림하신다는 약속이 어디 있느냐 조상들이 잔 후로부터 만물이 처음 창조될 때와 같이 그냥 있다 하니',
'벧후3:3-9':'먼저 이것을 알지니 말세에 조롱하는 자들이 와서 자기의 정욕을 따라 행하며 조롱하여 이르되 주께서 강림하신다는 약속이 어디 있느냐 조상들이 잔 후로부터 만물이 처음 창조될 때와 같이 그냥 있다 하니 이는 하늘이 옛적부터 있는 것과 땅이 물에서 나와 물로 성립된 것도 하나님의 말씀으로 된 것을 그들이 일부러 잊으려 함이로다 이로 말미암아 그 때에 세상은 물이 넘침으로 멸망하였으되 이제 하늘과 땅은 그 동일한 말씀으로 불사르기 위하여 보호하신 바 되어 경건하지 아니한 사람들의 심판과 멸망의 날까지 보존하여 두신 것이니라 사랑하는 자들아 주께는 하루가 천 년 같고 천 년이 하루 같다는 이 한 가지를 잊지 말라 주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 주께서는 너희를 대하여 오래 참으사 아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라',
'벧후3:9':'주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 주께서는 너희를 대하여 오래 참으사 아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라',
'빌2:14-16':'모든 일을 원망과 시비가 없이 하라 이는 너희가 흠이 없고 순전하여 어그러지고 거스르는 세대 가운데서 하나님의 흠 없는 자녀로 세상에서 그들 가운데 빛들로 나타내며 생명의 말씀을 밝혀 나의 달음질이 헛되지 아니하고 수고도 헛되지 아니함으로 그리스도의 날에 내가 자랑할 것이 있게 하려 함이라',
'빌3:20':'그러나 우리의 시민권은 하늘에 있는지라 거기로부터 구원하는 자 곧 주 예수 그리스도를 기다리노니',
'빌3:20-21':'그러나 우리의 시민권은 하늘에 있는지라 거기로부터 구원하는 자 곧 주 예수 그리스도를 기다리노니 그는 만물을 자기에게 복종하게 하실 수 있는 자의 역사로 우리의 낮은 몸을 자기 영광의 몸의 형체와 같이 변하게 하시리라',
'빌4:6':'아무것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라',
'빌4:9':'너희는 내게 배우고 받고 듣고 본 바를 행하라 그리하면 평강의 하나님이 너희와 함께 계시리라',
'빌4:15-17':'빌립보 사람들아 너희도 알거니와 복음의 시초에 내가 마게도냐를 떠날 때에 주고 받는 내 일에 참여한 교회가 너희 외에 아무도 없었느니라 데살로니가에 있을 때에도 너희가 한 번뿐 아니라 두 번이나 쓸 것을 내게 보내었도다 내가 선물을 구함이 아니요 오직 너희에게 유익하도록 풍성한 열매를 구함이라',
'빌4:15-19':'빌립보 사람들아 너희도 알거니와 복음의 시초에 내가 마게도냐를 떠날 때에 주고 받는 내 일에 참여한 교회가 너희 외에 아무도 없었느니라 데살로니가에 있을 때에도 너희가 한 번뿐 아니라 두 번이나 쓸 것을 내게 보내었도다 내가 선물을 구함이 아니요 오직 너희에게 유익하도록 풍성한 열매를 구함이라 내게는 모든 것이 있고 또 풍부한지라 에바브로디도 편에 너희가 준 것을 받으므로 내가 풍족하니 이는 받으실 만한 향기로운 제물이요 하나님을 기쁘시게 한 것이라 나의 하나님이 그리스도 예수 안에서 영광 가운데 그 풍성한 대로 너희 모든 쓸 것을 채우시리라',
'사1:2':'하늘이여 들으라 땅이여 귀를 기울이라 여호와께서 말씀하시기를 내가 자식을 양육하였거늘 그들이 나를 거역하였도다',
'사1:18-19':'여호와께서 말씀하시되 오라 우리가 서로 변론하자 너희의 죄가 주홍 같을지라도 눈과 같이 희어질 것이요 진홍 같이 붉을지라도 양털 같이 희게 되리라 너희가 즐겨 순종하면 땅의 아름다운 소산을 먹을 것이요',
'사6:3':'서로 불러 이르되 거룩하다 거룩하다 거룩하다 만군의 여호와여 그의 영광이 온 땅에 충만하도다',
'사6:8':'내가 또 주의 목소리를 들으니 주께서 이르시되 내가 누구를 보내며 누가 우리를 위하여 갈꼬 하시니 그 때에 내가 이르되 내가 여기 있나이다 나를 보내소서 하였더니',
'사11:9':'내 거룩한 산 모든 곳에서 해 됨도 없고 상함도 없을 것이니 이는 물이 바다를 덮음 같이 여호와를 아는 지식이 세상에 충만할 것임이니라',
'사14:12-15':'너 아침의 아들 계명성이여 어찌 그리 하늘에서 떨어졌으며 너 열국을 엎은 자여 어찌 그리 땅에 찍혔는고 네가 네 마음에 이르기를 내가 하늘에 올라 하나님의 뭇 별 위에 내 자리를 높이리라 내가 북극 집회의 산 위에 앉으리라 가장 높은 구름에 올라가 지극히 높은 이와 같아지리라 하는도다 그러나 이제 네가 스올 곧 구덩이 맨 밑에 떨어짐을 당하리로다',
'사45:5-6':'나는 여호와라 나 외에 다른 이가 없나니 나 밖에 신이 없느니라 너는 나를 알지 못하였을지라도 내가 네 띠를 동일 것이라 해 뜨는 곳에서든지 지는 곳에서든지 나 밖에 다른 이가 없는 줄을 알게 하리라 나는 여호와라 다른 이가 없느니라',
'사55:6-9':'너희는 여호와를 만날 만한 때에 찾으라 가까이 계실 때에 그를 부르라 악인은 그의 길을, 불의한 자는 그의 생각을 버리고 여호와께로 돌아오라 그리하면 그가 긍휼히 여기시리라 우리 하나님께로 돌아오라 그가 너그럽게 용서하시리라 이는 내 생각이 너희의 생각과 다르며 내 길은 너희의 길과 다름이니라 여호와의 말씀이니라 이는 하늘이 땅보다 높음 같이 내 길은 너희의 길보다 높으며 내 생각은 너희의 생각보다 높음이니라',
'사55:11':'내 입에서 나가는 말도 이와 같이 헛되이 내게로 되돌아오지 아니하고 나의 기뻐하는 뜻을 이루며 내가 보낸 일에 형통함이니라',
'사57:15':'지존하며 영원히 거하시는 이가 이같이 말씀하시되 내 이름은 거룩하니 나는 통회하고 마음이 겸손한 자와 함께 있어 겸손한 자의 영을 소생시키며 통회하는 자의 마음을 소생시키리라',
'사59:1-2':'여호와의 손이 짧아 구원하지 못하심도 아니요 귀가 둔하여 듣지 못하심도 아니라 오직 너희 죄악이 너희와 너희 하나님 사이를 갈라 놓았고 너희 죄가 그의 얼굴을 가리어서 너희에게서 듣지 않으시게 함이니',
'사66:2':'나 여호와가 말하노라 내 손이 이 모든 것을 지었으므로 다 내 것이니라 무릇 마음이 가난하고 심령에 통회하며 내 말을 듣고 떠는 자 그 사람은 내가 돌보려니와',

'살전1:8':'주의 말씀이 너희에게로부터 마게도냐와 아가야에만 들릴 뿐 아니라 하나님을 향하는 너희 믿음의 소문이 각처에 퍼졌으므로 우리는 아무 말도 할 것이 없노라',
'살전1:10':'또 죽은 자들 가운데서 다시 살리신 그의 아들이 하늘로부터 강림하심을 기다린다고 말하니 이는 장래의 노하심에서 우리를 건지시는 예수시니라',
'살전2:4':'오직 하나님께 옳게 여기심을 입어 복음을 위탁 받았으니 우리가 이와 같이 말함은 사람을 기쁘게 하려 함이 아니요 오직 우리 마음을 감찰하시는 하나님을 기쁘시게 하려 함이라',
'살전2:7-8':'우리는 그리스도의 사도로서 마땅히 권위를 주장할 수 있으나 도리어 너희 가운데서 유순한 자가 되어 유모가 자기 자녀를 기름과 같이 하였으니 우리가 이같이 너희를 사모하여 하나님의 복음뿐 아니라 우리의 목숨까지도 너희에게 주기를 기뻐함은 너희가 우리의 사랑하는 자 됨이라',
'살전2:10':'우리가 너희 믿는 자들을 향하여 어떻게 거룩하고 옳고 흠 없이 대하였는지에 대하여 너희가 증인이요 하나님도 그러하시도다',
'살전2:11':'너희도 아는 바와 같이 우리가 너희 각 사람에게 아버지가 자기 자녀에게 하듯 권면하고',
'살전2:12':'이는 너희를 부르사 자기 나라와 영광에 이르게 하시는 하나님께 합당히 행하게 하려 함이라',
'살전3:5':'이러므로 나도 참다 못하여 너희 믿음을 알기 위하여 보내었노니 이는 혹 시험하는 자가 너희를 시험하여 우리 수고를 헛되게 할까 함일러니',
'살전4:13':'형제들아 자는 자들에 관하여는 너희가 알지 못함을 우리가 원하지 아니하노니 이는 소망 없는 다른 이와 같이 슬퍼하지 않게 하려 함이라',
'살전4:13-18':'형제들아 자는 자들에 관하여는 너희가 알지 못함을 우리가 원하지 아니하노니 이는 소망 없는 다른 이와 같이 슬퍼하지 않게 하려 함이라 우리가 예수께서 죽으셨다가 다시 살아나심을 믿을진대 이와 같이 예수 안에서 자는 자들도 하나님이 그와 함께 데리고 오시리라 우리가 주의 말씀으로 너희에게 이것을 말하노니 주께서 강림하실 때까지 우리 살아 남아 있는 자도 자는 자보다 결코 앞서지 못하리라 주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라 그러므로 이러한 말로 서로 위로하라',
'살전4:16-17':'주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라',
'살전4:18':'그러므로 이러한 말로 서로 위로하라',

'살전5:3':'그들이 평안하다, 안전하다 할 그 때에 임신한 여자에게 해산의 고통이 이름과 같이 멸망이 갑자기 그들에게 이르리니 결코 피하지 못하리라',

'살전5:19':'성령을 소멸하지 말며',

'약2:15-16':'만일 형제나 자매가 헐벗고 일용할 양식이 없는데 너희 중에 누구든지 그에게 이르되 평안히 가라, 덥게 하라, 배부르게 하라 하며 그 몸에 쓸 것을 주지 아니하면 무슨 유익이 있으리요',
'약4:3':'구하여도 받지 못함은 정욕으로 쓰려고 잘못 구하기 때문이라',

'약4:7':'그런즉 너희는 하나님께 복종할지어다 마귀를 대적하라 그리하면 너희를 피하리라',
'약4:17':'그러므로 사람이 선을 행할 줄 알고도 행하지 아니하면 죄니라',

'엡2:2':'그 때에 너희는 그 가운데서 행하여 이 세상 풍조를 따르고 공중의 권세 잡은 자를 따랐으니 곧 지금 불순종의 아들들 가운데서 역사하는 영이라',
'엡2:8-9':'너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라',
'엡3:8':'모든 성도 중에 지극히 작은 자보다 더 작은 나에게 이 은혜를 주신 것은 측량할 수 없는 그리스도의 풍성함을 이방인에게 전하게 하시고',
'엡3:14-21':'이러므로 내가 하늘과 땅에 있는 각 족속에게 이름을 주신 아버지 앞에 무릎을 꿇고 비노니 그의 영광의 풍성함을 따라 그의 성령으로 말미암아 너희 속사람을 능력으로 강건하게 하시오며 믿음으로 말미암아 그리스도께서 너희 마음에 계시게 하시옵고 너희가 사랑 가운데서 뿌리가 박히고 터가 굳어져서 능히 모든 성도와 함께 지식에 넘치는 그리스도의 사랑을 알고 그 너비와 길이와 높이와 깊이가 어떠함을 깨달아 하나님의 모든 충만하신 것으로 너희에게 충만하게 하시기를 구하노라 우리 가운데서 역사하시는 능력대로 우리가 구하거나 생각하는 모든 것에 더 넘치도록 능히 하실 이에게 교회 안에서와 그리스도 예수 안에서 영광이 대대로 영원무궁하기를 원하노라 아멘',
'엡4:29-32':'무릇 더러운 말은 너희 입 밖에도 내지 말고 오직 덕을 세우는 데 소용되는 대로 선한 말을 하여 듣는 자들에게 은혜를 끼치게 하라 하나님의 성령을 근심하게 하지 말라 그 안에서 너희가 구원의 날까지 인치심을 받았느니라 너희는 모든 악독과 노함과 분냄과 떠드는 것과 비방하는 것을 모든 악의와 함께 버리고 서로 친절하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라',

'엡5:11-12':'너희는 열매 없는 어둠의 일에 참여하지 말고 도리어 책망하라 그들이 은밀히 행하는 것들은 말하기도 부끄러운 것들이라',

'엡5:18':'술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라',

'행1:9-11':'이 말씀을 마치시고 그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라 올라가실 때에 제자들이 자세히 하늘을 쳐다보고 있는데 흰 옷 입은 두 사람이 그들 곁에 서서 이르되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다보느냐 너희 가운데서 하늘로 올려지신 이 예수는 하늘로 가심을 본 그대로 오시리라 하였느니라',
'행1:14':'여자들과 예수의 어머니 마리아와 예수의 아우들과 더불어 마음을 같이하여 오로지 기도에 힘쓰더라',
'행3:25':'너희는 선지자들의 자손이요 또 하나님이 너희 조상과 더불어 세우신 언약의 자손이라 아브라함에게 이르시기를 땅 위의 모든 족속이 너의 씨로 말미암아 복을 받으리라 하셨으니',
'행4:12':'다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라',
'행4:31':'빌기를 다하매 모인 곳이 진동하더니 무리가 다 성령이 충만하여 담대히 하나님의 말씀을 전하니라',
'행5:1-10':'아나니아라 하는 사람이 그의 아내 삽비라와 더불어 소유를 팔아 그 값에서 얼마를 감추매 그 아내도 이를 알더라 얼마만 가져다가 사도들의 발 앞에 두니 베드로가 이르되 아나니아야 어찌하여 사탄이 네 마음에 가득하여 네가 성령을 속이고 땅 값 얼마를 감추었느냐 땅이 그대로 있을 때에는 네 땅이 아니며 판 후에도 네 마음대로 할 수가 없더냐 어찌하여 이 일을 네 마음에 두었느냐 사람에게 거짓말한 것이 아니요 하나님께로다 아나니아가 이 말을 듣고 엎드러져 혼이 떠나니 … 삽비라가 들어오니 … 베드로가 이르되 너희가 어찌 함께 꾀하여 주의 영을 시험하려 하느냐 보라 네 남편을 장사하고 오는 사람들의 발이 문 앞에 이르렀으니 또 너를 메어 내가리라 하니 곧 그의 발이 베드로의 발 앞에 엎드러져 혼이 떠나니라',
'행7:51':'목이 굳고 마음과 귀에 할례를 받지 못한 사람들아 너희도 너희 조상과 같이 항상 성령을 거스르는도다',
'행8:1':'사울은 그가 죽임 당함을 마땅히 여기더라 그 날에 예루살렘에 있는 교회에 큰 박해가 있어 사도 외에는 다 유대와 사마리아 모든 땅으로 흩어지니라',
'행8:1,4':'사울은 그가 죽임 당함을 마땅히 여기더라 그 날에 예루살렘에 있는 교회에 큰 박해가 있어 사도 외에는 다 유대와 사마리아 모든 땅으로 흩어지니라 … 그 흩어진 사람들이 두루 다니며 복음의 말씀을 전할새',
'행8:4':'그 흩어진 사람들이 두루 다니며 복음의 말씀을 전할새',
'행8:26-35':'주의 사자가 빌립에게 말하여 이르되 일어나서 남쪽으로 향하여 예루살렘에서 가사로 내려가는 길까지 가라 하니 그 길은 광야라 일어나 가서 보니 에디오피아 사람 곧 에디오피아 여왕 간다게의 모든 국고를 맡은 큰 권세가 있는 내시가 예배하러 예루살렘에 왔다가 돌아가는데 병거에 앉아서 선지자 이사야의 글을 읽더라 … 빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느냐 대답하되 인도해 주는 사람이 없으니 어찌 깨달을 수 있느냐 하고 빌립을 청하여 병거에 올라 자기 곁에 앉으라 하니라 … 빌립이 입을 열어 이 성경에서 시작하여 예수를 가르쳐 복음을 전하니',
'행8:35':'빌립이 입을 열어 이 성경에서 시작하여 예수를 가르쳐 복음을 전하니',
'행10:43':'그에 대하여 모든 선지자도 증언하되 그를 믿는 사람들이 다 그의 이름을 힘입어 죄 사함을 받는다 하였느니라',
'행11:24':'바나바는 착한 사람이요 성령과 믿음이 충만한 사람이라 이에 큰 무리가 주께 더하더라',
'행12:5':'이에 베드로는 옥에 갇혔고 교회는 그를 위하여 간절히 하나님께 빌더라',
'행12:6-11':'헤롯이 그를 끌어 내려고 하는 그 전날 밤에 베드로가 두 군인 틈에서 두 쇠사슬에 매여 누워 자는데 파수꾼들이 문 밖에서 옥을 지키더니 홀연히 주의 사자가 나타나며 옥 중에 광채가 빛나며 또 베드로의 옆구리를 쳐 깨워 이르되 급히 일어나라 하니 쇠사슬이 그 손에서 벗어지더라 … 그들이 … 나가서 한 거리를 지나매 천사가 곧 떠나더라 이에 베드로가 정신이 나서 이르되 내가 이제야 참으로 주께서 그의 천사를 보내어 나를 헤롯의 손과 유대 백성의 모든 기대에서 벗어나게 하신 줄 알겠노라 하여',
'행13:2':'주를 섬겨 금식할 때에 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니',
'행13:2,4':'주를 섬겨 금식할 때에 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니 … 두 사람이 성령의 보내심을 받아 실루기아에 내려가 거기서 배 타고 구브로에 가서',
'행14:21-22':'복음을 그 성에서 전하여 많은 사람을 제자로 삼고 루스드라와 이고니온과 안디옥으로 돌아가서 제자들의 마음을 굳건하게 하여 이 믿음에 머물러 있으라 권하고 또 우리가 하나님의 나라에 들어가려면 많은 환난을 겪어야 할 것이라 하고',
'행15:36':'며칠 후에 바울이 바나바에게 말하되 우리가 주의 말씀을 전한 각 성으로 다시 가서 형제들이 어떠한가 방문하자 하고',
'행16:6-7':'성령이 아시아에서 말씀을 전하지 못하게 하시거늘 그들이 브루기아와 갈라디아 땅으로 다녀가 무시아 앞에 이르러 비두니아로 가고자 애쓰되 예수의 영이 허락하지 아니하시는지라',
'행16:25':'한밤중에 바울과 실라가 기도하고 하나님을 찬송하매 죄수들이 듣더라',
'행16:31':'이르되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고',
'행17:2-3':'바울이 자기의 관례대로 그들에게로 들어가서 세 안식일에 성경을 가지고 강론하며 뜻을 풀어 그리스도가 해를 받고 죽은 자 가운데서 다시 살아나야 할 것을 증언하고 이르되 내가 너희에게 전하는 이 예수가 곧 그리스도라 하니',
'행17:17':'회당에서는 유대인과 경건한 사람들과 또 장터에서는 날마다 만나는 사람들과 변론하니',
'행17:24-25':'우주와 그 가운데 있는 만물을 지으신 하나님께서는 천지의 주재시니 손으로 지은 전에 계시지 아니하시고 또 무엇이 부족한 것처럼 사람의 손으로 섬김을 받으시는 것이 아니니 이는 만민에게 생명과 호흡과 만물을 친히 주시는 이심이라',
'행18:11':'일 년 육 개월을 머물며 그들 가운데서 하나님의 말씀을 가르치니라',
'행20:20':'유익한 것은 무엇이든지 공중 앞에서나 각 집에서나 거리낌이 없이 너희에게 전하여 가르치고',
'행20:33,35':'내가 아무의 은이나 금이나 의복을 탐하지 아니하였고 … 범사에 여러분에게 모본을 보여준 바와 같이 수고하여 약한 사람들을 돕고 또 주 예수께서 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을 기억하여야 할지니라',
'행20:35':'범사에 여러분에게 모본을 보여준 바와 같이 수고하여 약한 사람들을 돕고 또 주 예수께서 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을 기억하여야 할지니라',
'행26:18':'그 눈을 뜨게 하여 어둠에서 빛으로, 사탄의 권세에서 하나님께로 돌아오게 하고 죄 사함과 나를 믿어 거룩하게 된 무리 가운데서 기업을 얻게 하리라 하더이다',
'행26:20':'먼저 다메섹과 예루살렘에 있는 사람과 유대 온 땅과 이방인에게까지 회개하고 하나님께로 돌아와서 회개에 합당한 일을 하라 전하므로',
'행26:22':'하나님의 도우심을 받아 내가 이 날까지 서서 높고 낮은 사람 앞에서 증언하는 것은 선지자들과 모세가 반드시 되리라고 말한 것 밖에 없으니',
'행27:35':'말을 마치고 떡을 가져다가 모든 사람 앞에서 하나님께 감사하고 떼어 먹기를 시작하니',
'히1:1':'옛적에 선지자들을 통하여 여러 부분과 여러 모양으로 우리 조상들에게 말씀하신 하나님이',
'히1:2':'이 모든 날 마지막에는 아들을 통하여 우리에게 말씀하셨으니 이 아들을 만유의 상속자로 세우시고 또 그로 말미암아 모든 세계를 지으셨느니라',
'히2:14-15':'자녀들은 혈과 육에 속하였으매 그도 또한 같은 모양으로 혈과 육을 함께 지니심은 죽음을 통하여 죽음의 세력을 잡은 자 곧 마귀를 멸하시며 또 죽기를 무서워하므로 한평생 매여 종 노릇 하는 모든 자들을 놓아 주려 하심이니',
'히4:12':'하나님의 말씀은 살아 있고 활력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 판단하나니',
'히4:15-16':'우리에게 있는 대제사장은 우리의 연약함을 동정하지 못하실 이가 아니요 모든 일에 우리와 똑같이 시험을 받으신 이로되 죄는 없으시니라 그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라',
'히7:25':'그러므로 자기를 힘입어 하나님께 나아가는 자들을 온전히 구원하실 수 있으니 이는 그가 항상 살아 계셔서 그들을 위하여 간구하심이라',
'히9:14':'하물며 영원하신 성령으로 말미암아 흠 없는 자기를 하나님께 드린 그리스도의 피가 어찌 너희 양심을 죽은 행실에서 깨끗하게 하고 살아 계신 하나님을 섬기게 하지 못하겠느냐',
'히10:12':'오직 그리스도는 죄를 위하여 한 영원한 제사를 드리시고 하나님 우편에 앉으사',
'히10:14':'그가 거룩하게 된 자들을 한 번의 제사로 영원히 온전하게 하셨느니라',
'히11:6':'믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라',
'히12:1-2':'이러므로 우리에게 구름 같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 하며 믿음의 주요 또 온전하게 하시는 이인 예수를 바라보자 그는 그 앞에 있는 기쁨을 위하여 십자가를 참으사 부끄러움을 개의치 아니하시더니 하나님 보좌 우편에 앉으셨느니라',
'히12:15':'너희는 하나님의 은혜에 이르지 못하는 자가 없도록 하고 또 쓴 뿌리가 나서 괴롭게 하여 많은 사람이 이로 말미암아 더럽게 되지 않도록 살피라',
'히13:5':'돈을 사랑하지 말고 있는 바를 족한 줄로 알라 그가 친히 말씀하시기를 내가 결코 너희를 버리지 아니하고 너희를 떠나지 아니하리라 하셨느니라',
'히13:15':'그러므로 우리는 예수로 말미암아 항상 찬송의 제사를 하나님께 드리자 이는 그 이름을 증언하는 입술의 열매니라',

/* SCL3 (그리스도와의 동행) — 제1과 교회 */
'엡5:23':'이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 그가 바로 몸의 구주시니라',
'행20:28':'여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라 성령이 그들 가운데 여러분을 감독자로 삼고 하나님이 자기 피로 사신 교회를 보살피게 하셨느니라',
'엡1:7':'우리는 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 속량 곧 죄 사함을 받았느니라',
