// ===================== STATE =====================
let memorized = JSON.parse(localStorage.getItem('nav_memorized')||'{}');
let view = 'landing';
let curSection = null;
let curCards = [];
let curIdx = 0;
let isFlipped = false;
let darkMode = localStorage.getItem('nav_dark') === '1';
let fontSize = parseInt(localStorage.getItem('nav_fs')||'16');
let curLesson = null;
let curBook = BOOKS[0];
let bsAnswers = JSON.parse(localStorage.getItem('nav_bible_answers')||'{}');
let bsMemos   = JSON.parse(localStorage.getItem('nav_bible_memos')||'{}');

function save(){localStorage.setItem('nav_memorized', JSON.stringify(memorized)); fbSaveMem();}
function cardKey(ref){return ref.replace(/\s/g,'');}
function totalCards(){return SECTIONS.reduce((a,s)=>a+s.subs.reduce((b,sub)=>b+sub.cards.length,0),0);}
function totalMem(){return Object.values(memorized).filter(Boolean).length;}

function applyTheme(){
  if(darkMode) document.documentElement.setAttribute('data-dark','1');
  else document.documentElement.removeAttribute('data-dark');
  document.documentElement.style.setProperty('--fs', fontSize+'px');
  const btn=document.getElementById('btn-dark');
  if(btn) btn.textContent = darkMode ? '☀️' : '🌙';
}
function toggleDark(){
  darkMode=!darkMode;
  localStorage.setItem('nav_dark', darkMode?'1':'0');
  applyTheme();
}
function adjustFont(d){
  fontSize=Math.max(13,Math.min(22,fontSize+d));
  localStorage.setItem('nav_fs', fontSize);
  document.documentElement.style.setProperty('--fs', fontSize+'px');
}
function goBack(){
  if(view==='cards'){ view='section'; render(); }
  else if(view==='section'){ view='home'; render(); }
  else if(view==='home'){ view='landing'; render(); }
  else if(view==='bible-lesson'){ view='bible'; render(); }
  else if(view==='bible'){ view='landing'; render(); }
  else if(view==='game-play'||view==='game-end'){ view='game-setup'; render(); }
  else if(view==='game-setup'){ view='landing'; render(); }
}

const COL={
  blue:['col-blue','col-blue-soft','txt-blue'],
  green:['col-green','col-green-soft','txt-green'],
  orange:['col-orange','col-orange-soft','txt-orange'],
  purple:['col-purple','col-purple-soft','txt-purple'],

  red:['col-red','col-red-soft','txt-red'],
};

// ===================== RENDER =====================
const app = document.getElementById('app');
function render(){
  {
    if(view==='landing') renderLanding();
    else if(view==='home') renderHome();
    else if(view==='section') renderSection();
    else if(view==='cards') renderCards();
    else if(view==='bible') renderBibleStudy();
    else if(view==='bible-lesson') renderBibleLesson();
    else if(view==='game-setup') renderGameSetup();
    else if(view==='game-play') renderGamePlay();
    else if(view==='game-end') renderGameEnd();
  }
  if(view!=='cards') app.scrollTop=0;
  document.getElementById('btn-back').style.display = view==='landing'?'none':'';
  document.getElementById('font-ctrl').style.display = (view==='cards')?'':'none';
  document.getElementById('topbar-title').textContent =
    view==='landing' ? '네비게이토' :
    view==='home' ? '성경 암송' :
    view==='bible' ? (curBook?(curBook.tag?curBook.tag+' '+curBook.title:curBook.title):'성경 공부') :
    view==='bible-lesson' ? curLesson.num :
    view==='game-setup' ? '암송 게임' :
    view==='game-play' ? ((GAME_TYPES.find(t=>t.id===gameType)||{name:'게임'}).name) :
    view==='game-end' ? '게임 결과' :
    curSection.title;
  if(view!=='cards') app.ontouchstart=app.ontouchend=null;
}

function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('nav_')) data[k]=localStorage.getItem(k);
  }
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download=`nav_backup_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      let count=0;
      Object.entries(data).forEach(([k,v])=>{ if(k.startsWith('nav_')){ localStorage.setItem(k,v); count++; } });
      alert(`복원 완료: ${count}개 항목이 복원되었습니다.`);
      location.reload();
    }catch{
      alert('파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
  input.value='';
}

// ── Bible Study helpers ──
function escH(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bsKey(lid,qi,si){ return si===undefined?`${lid}_${qi}`:`${lid}_${qi}_${si}`; }
function bsProgress(lesson){
  let total=0,done=0;
  lesson.qs.forEach((q,qi)=>{
    if(q.subs) q.subs.forEach((_,si)=>{ total++; if((bsAnswers[bsKey(lesson.id,qi,si)]||'').trim()) done++; });
    else { total++; if((bsAnswers[bsKey(lesson.id,qi)]||'').trim()) done++; }
  });
  return {total,done};
}
function bsMemoInput(lid,el){
  bsMemos[lid]=el.value;
  localStorage.setItem('nav_bible_memos',JSON.stringify(bsMemos));
  fbSaveMemo(lid,el.value);
}
function bsInput(key,el){
  bsAnswers[key]=el.value;
  localStorage.setItem('nav_bible_answers',JSON.stringify(bsAnswers));
  fbSaveAns(key,el.value);
  el.classList.add('fl');

}

let _ruid=0;
function parseRefStr(r){
  if(!r) return [];
  return r.replace(/[./]\s*(?=[가-힣])/g,'|||').split('|||')
    .map(s=>s.trim().replace(/\s*,\s*/g,','))
    .filter(Boolean);
}
function refHtml(r){
  if(!r) return '';
  const uid=_ruid++;
  const color=curBook?curBook.color:'teal';
  const parts=parseRefStr(r);
  const rows=parts.map(p=>{
    const v=VERSES[p];
    return v
      ?`<div class="bs-ref-verse"><span class="bs-ref-key">${escH(p)}</span><span class="bs-ref-text">${escH(v)}</span></div>`
      :`<div class="bs-ref-verse"><span class="bs-ref-key">${escH(p)}</span><span class="bs-ref-miss">성경을 직접 찾아보세요</span></div>`;
  });
  return `<div id="rb${uid}" class="bs-ref-toggle" style="color:var(--${color})" onclick="toggleRef(${uid})"><span class="rt-arrow">▼</span>${escH(r)}</div>
<div id="rp${uid}" class="bs-ref-panel" style="background:var(--${color}-soft);border-color:var(--${color})">${rows.join('')}</div>`;
}
function toggleRef(uid){
  const p=document.getElementById('rp'+uid);
  const b=document.getElementById('rb'+uid);
  if(!p) return;
  p.classList.toggle('open');
  if(b){const a=b.querySelector('.rt-arrow');if(a)a.style.transform=p.classList.contains('open')?'rotate(180deg)':'';}
}

// ===================== GAME =====================
const GAME_TYPES=[
  {id:'fill',icon:'✏️',name:'빈칸 채우기'},
  {id:'order',icon:'🔀',name:'단어 배열'},
  {id:'match',icon:'🔗',name:'구절 매칭'},
  {id:'type',icon:'⌨️',name:'타이핑 테스트'},
];
let gameSections={};
let gameType='fill';
let gameCards=[];
let gameIdx=0;
let gameScore={c:0,w:0};
let gameState={};

function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function getGameCards(){
  const r=[];
  SECTIONS.forEach(s=>{if(gameSections[s.id])s.subs.forEach(sub=>r.push(...sub.cards));});
  return r;
}
function openGame(){
  if(!Object.keys(gameSections).length) SECTIONS.forEach(s=>gameSections[s.id]=true);
  view='game-setup'; render();
}
function selectGameType(t){gameType=t; renderGameSetup();}
function toggleGameSection(id){gameSections[id]=!gameSections[id]; renderGameSetup();}
function selectAllSections(v){SECTIONS.forEach(s=>gameSections[s.id]=!!v); renderGameSetup();}
function startGame(){
  const all=getGameCards();
  if(!all.length||!gameType)return;
  gameCards=shuffle([...all]); gameIdx=0; gameScore={c:0,w:0};
  view='game-play'; initGameRound(); render();
}
function initGameRound(){
  const c=gameCards[gameIdx];
  if(!c){view='game-end';render();return;}
  if(gameType==='fill') gameState=makeFillBlank(c);
  else if(gameType==='order') gameState=makeWordOrder(c);
  else if(gameType==='match') gameState=makeMatch();
  else gameState={typed:'',submitted:false,score:0};
}
function nextGameRound(){
  gameIdx+=(gameType==='match'?gameState.n:1);
  if(gameIdx>=gameCards.length){view='game-end';render();return;}
  initGameRound(); render();
}

// ─ Fill in the Blank ─
function makeFillBlank(card){
  const words=card.text.split(/\s+/);
  const cleaned=words.map(w=>w.replace(/[.,…!?]/g,''));
  const cands=cleaned.map((w,i)=>({w,i})).filter(x=>x.w.length>=2);
  const pick=cands.length?cands[Math.floor(Math.random()*cands.length)]:{w:cleaned[0]||'',i:0};
  const answer=pick.w;
  const pool=new Set();
  gameCards.forEach(c=>c.text.split(/\s+/).forEach(w=>{const cl=w.replace(/[.,…!?]/g,'');if(cl.length>=2&&cl!==answer)pool.add(cl);}));
  const wrongs=shuffle([...pool]).slice(0,3);
  while(wrongs.length<3)wrongs.push(['하나님','믿음','구원','사랑'][wrongs.length]);
  const displayWords=words.map((w,i)=>i===pick.i?'___':w);
  const choices=shuffle([answer,...wrongs.slice(0,3)]);
  return{displayWords,answer,choices,answered:false,isCorrect:false,chosen:null};
}
function answerFill(idx){
  if(gameState.answered)return;
  const ch=gameState.choices[idx];
  gameState.chosen=ch; gameState.answered=true;
  if(ch===gameState.answer){gameScore.c++;gameState.isCorrect=true;}else gameScore.w++;
  renderGamePlay();
}
function renderFillBlank(){
  const card=gameCards[gameIdx]; const s=gameState;
  const txt=s.displayWords.map(w=>w==='___'?`<span class="game-blank">${s.answered?escH(s.answer):''}</span>`:escH(w)).join(' ');
  const btns=s.choices.map((ch,i)=>{
    let cl='game-choice';
    if(s.answered){if(ch===s.answer)cl+=' correct';else if(ch===s.chosen)cl+=' wrong';}
    return `<button class="${cl}"${s.answered?'':` onclick="answerFill(${i})"`}>${escH(ch)}</button>`;
  }).join('');
  const more=gameIdx+1<gameCards.length?'다음 ▶':'결과 보기 ▶';
  return `<div class="game-card"><div class="game-ref">${escH(card.ref)}</div><div class="game-verse-text">${txt}</div></div>
<div class="game-choices">${btns}</div>${s.answered?`<button class="game-next-btn" onclick="nextGameRound()">${more}</button>`:''}`;
}

// ─ Word Order ─
function makeWordOrder(card){
  const words=card.text.split(/\s+/);
  const avail=shuffle(words.map((w,i)=>({w,id:'wo'+i})));
  return{words,avail,placed:[],answered:false,isCorrect:false};
}
function placeWord(id){
  if(gameState.answered)return;
  const item=gameState.avail.find(x=>x.id===id);
  if(!item)return;
  gameState.avail=gameState.avail.filter(x=>x.id!==id);
  gameState.placed.push(item);
  if(gameState.avail.length===0){
    const res=gameState.placed.map(x=>x.w).join(' ');
    gameState.answered=true;
    gameState.isCorrect=res===gameState.words.join(' ');
    if(gameState.isCorrect)gameScore.c++;else gameScore.w++;
  }
  renderGamePlay();
}
function unplaceWord(id){
  if(gameState.answered)return;
  const item=gameState.placed.find(x=>x.id===id);
  if(!item)return;
  gameState.placed=gameState.placed.filter(x=>x.id!==id);
  gameState.avail.push(item);
  renderGamePlay();
}
function renderWordOrder(){
  const card=gameCards[gameIdx]; const s=gameState;
  const placed=s.placed.map(it=>`<span class="word-chip placed" onclick="${s.answered?'':'unplaceWord(\''+it.id+'\')'}">${escH(it.w)}</span>`).join('');
  const avail=s.avail.map(it=>`<span class="word-chip avail" onclick="placeWord('${it.id}')">${escH(it.w)}</span>`).join('');
  let fb='';
  if(s.answered){
    if(s.isCorrect)fb=`<div style="color:var(--green);font-weight:700;margin-bottom:10px">✓ 정답입니다!</div>`;
    else fb=`<div style="color:var(--red);font-weight:700;margin-bottom:8px">✗ 틀렸습니다</div><div class="typing-answer">${escH(s.words.join(' '))}</div>`;
  }
  const more=gameIdx+1<gameCards.length?'다음 ▶':'결과 보기 ▶';
  return `<div class="game-card"><div class="game-ref">${escH(card.ref)}</div>
<div class="word-zone">${placed||'<span style="color:var(--text3);font-size:.8rem">단어를 눌러 여기에 배열하세요</span>'}</div></div>
${fb}<div class="word-chips-pool">${avail}</div>
${s.answered?`<button class="game-next-btn" onclick="nextGameRound()">${more}</button>`:''}`;
}

// ─ Matching (verse → reference) ─
function makeMatch(){
  const card=gameCards[gameIdx];
  const others=shuffle(gameCards.filter((_,i)=>i!==gameIdx)).slice(0,3);
  const wrongs=others.map(c=>c.ref);
  while(wrongs.length<3)wrongs.push(['빌 4:13','요 3:16','시 23:1'][wrongs.length]);
  const choices=shuffle([card.ref,...wrongs.slice(0,3)]);
  const snippet=card.text.length>50?card.text.slice(0,50)+'…':card.text;
  return{snippet,answer:card.ref,choices,answered:false,isCorrect:false,chosen:null,n:1};
}
function answerMatch(idx){
  if(gameState.answered)return;
  const ch=gameState.choices[idx];
  gameState.chosen=ch; gameState.answered=true;
  if(ch===gameState.answer){gameScore.c++;gameState.isCorrect=true;}else gameScore.w++;
  renderGamePlay();
}
function renderMatchingGame(){
  const s=gameState;
  const btns=s.choices.map((ch,i)=>{
    let cl='game-choice';
    if(s.answered){if(ch===s.answer)cl+=' correct';else if(ch===s.chosen)cl+=' wrong';}
    return `<button class="${cl}" style="font-weight:700"${s.answered?'':` onclick="answerMatch(${i})"`}>${escH(ch)}</button>`;
  }).join('');
  const more=gameIdx+1<gameCards.length?'다음 ▶':'결과 보기 ▶';
  return `<div class="game-card">
<div style="font-size:.75rem;color:var(--text2);margin-bottom:8px;font-weight:600">이 구절의 출처는?</div>
<div class="game-verse-text">"${escH(s.snippet)}"</div></div>
<div class="game-choices">${btns}</div>${s.answered?`<button class="game-next-btn" onclick="nextGameRound()">${more}</button>`:''}`;
}

// ─ Typing Test ─
function submitTyping(){
  const ta=document.getElementById('game-ta');
  if(!ta||!ta.value.trim())return;
  const card=gameCards[gameIdx];
  const sc=scoreTyping(ta.value.trim(),card.text);
  gameState.typed=ta.value; gameState.submitted=true; gameState.score=sc;
  if(sc>=70)gameScore.c++;else gameScore.w++;
  renderGamePlay();
}
function scoreTyping(t,a){
  const norm=s=>s.trim().replace(/\s+/g,' ').replace(/[.,…!?]/g,'');
  const nt=norm(t),na=norm(a);
  if(nt===na)return 100;
  const tw=nt.split(' '),aw=na.split(' ');
  let ok=0; aw.forEach((w,i)=>{if(tw[i]===w)ok++;});
  return Math.round(ok/aw.length*100);
}
function renderTypingTest(){
  const card=gameCards[gameIdx]; const s=gameState;
  let fb='';
  if(s.submitted){
    const cl=s.score>=80?'good':s.score>=50?'ok':'bad';
    const ic=s.score>=80?'✓ 훌륭해요':s.score>=50?'△ 아깝네요':'✗ 다시 도전';
    fb=`<div class="typing-result ${cl}">${ic} · 유사도 ${s.score}%</div>
<div class="typing-answer"><strong>정답:</strong> ${escH(card.text)}</div>
<button class="game-next-btn" onclick="nextGameRound()">${gameIdx+1<gameCards.length?'다음 ▶':'결과 보기 ▶'}</button>`;
  }
  return `<div class="game-card"><div class="game-ref">${escH(card.ref)}</div>
<div style="font-size:.78rem;color:var(--text2);margin-bottom:8px">구절을 직접 입력하세요</div>
<textarea class="game-ta" id="game-ta" placeholder="구절을 여기에 입력하세요..."${s.submitted?' readonly':''}>${escH(s.typed)}</textarea>
${!s.submitted?`<button class="game-submit-btn" onclick="submitTyping()">제출</button>`:''}</div>${fb}`;
}

  app.querySelector('.inner').innerHTML=`

<div class="game-sel-bar">
  <span class="game-sel-count">선택된 구절: ${cards.length}개</span>
  <button class="game-sel-all" onclick="selectAllSections(${!allSel})">${allSel?'전체 해제':'전체 선택'}</button>
</div>
${SECTIONS.map(s=>{
  const cnt=s.subs.reduce((a,sub)=>a+sub.cards.length,0);
  return`<label class="game-sec-cb"><input type="checkbox"${gameSections[s.id]?' checked':''} onchange="toggleGameSection('${s.id}')"><div class="gsc-info"><div class="gsc-title">${s.icon} ${s.title}</div><div class="gsc-count">${s.subtitle} · ${cnt}구절</div></div></label>`;
}).join('')}
<div class="section-label" style="margin-top:20px">게임 유형 선택</div>
<div class="game-type-grid">
${GAME_TYPES.map(t=>`<button class="game-type-btn${gameType===t.id?' sel':''}" onclick="selectGameType('${t.id}')"><div class="gt-icon">${t.icon}</div><div class="gt-name">${t.name}</div></button>`).join('')}
</div>
<button class="game-start-btn" onclick="startGame()"${cards.length<2?' disabled':''}>게임 시작 (${cards.length}개 구절)</button>`;
}
function renderGamePlay(){
  if(!gameCards[gameIdx]){view='game-end';render();return;}
  const total=gameCards.length, cur=gameIdx+1, pct=Math.round(cur/total*100);
  let content='';
  if(gameType==='fill') content=renderFillBlank();
  else if(gameType==='order') content=renderWordOrder();
  else if(gameType==='match') content=renderMatchingGame();
  else content=renderTypingTest();
  app.querySelector('.inner').innerHTML=`
<div class="game-score-row">
  <div class="game-score-box"><div class="gsn txt-green">${gameScore.c}</div><div class="gsl">정답</div></div>
  <div class="game-score-box"><div class="gsn" style="color:var(--text2)">${cur}/${total}</div><div class="gsl">진행</div></div>
  <div class="game-score-box"><div class="gsn txt-red">${gameScore.w}</div><div class="gsl">오답</div></div>
</div>
<div class="prog-wrap"><div class="prog-track"><div class="prog-bar col-purple" style="width:${pct}%"></div></div></div>
${content}`;
}
function renderGameEnd(){
  const total=gameScore.c+gameScore.w;
  const pct=total?Math.round(gameScore.c/total*100):0;
  const icon=pct>=80?'🏆':pct>=60?'⭐':pct>=40?'📚':'💪';
  const msg=pct>=80?'훌륭해요!':pct>=60?'잘 했어요!':pct>=40?'조금 더 연습해요!':'계속 도전하세요!';
  app.querySelector('.inner').innerHTML=`
<div class="game-end-wrap">
  <div class="game-end-icon">${icon}</div>
  <div class="game-end-score">${pct}%</div>
  <div class="game-end-sub">${gameScore.c} / ${total} 정답<br>${msg}</div>
  <button class="game-end-btn col-purple" style="color:#fff" onclick="startGame()">다시 하기</button>
  <button class="game-end-btn" style="background:var(--card);color:var(--text);border:1px solid var(--border)" onclick="view='game-setup';render()">설정으로 돌아가기</button>
</div>`;
}

function renderHome(){
  const total=totalCards(), mem=totalMem();
  const pct=Math.round(mem/total*100)||0;
  app.querySelector('.inner').innerHTML=`
<div class="stats-card col-blue">
  <div class="greeting">네비게이토 암송카드</div>
  <div class="big">${pct}%</div>
  <div class="sub">${mem} / ${total} 구절 암송 완료</div>
  <div class="stats-row">
    <div class="s"><div class="n">${total}</div><div class="l">전체</div></div>
    <div class="s"><div class="n">${mem}</div><div class="l">완료</div></div>
    <div class="s"><div class="n">${total-mem}</div><div class="l">남음</div></div>
  </div>
</div>
<div class="section-label">섹션 선택</div>
${SECTIONS.map(s=>{
  const all=s.subs.flatMap(sub=>sub.cards);
  const mc=all.filter(c=>memorized[cardKey(c.ref)]).length;
  const sp=all.length?Math.round(mc/all.length*100):0;
  const [bg,,txt]=COL[s.color]||COL.blue;
  const soft=(COL[s.color]||COL.blue)[1];
  return`<div class="sc" onclick="openSection('${s.id}')">
  <div class="sc-icon ${soft} ${txt}">${s.icon}</div>
  <div class="sc-info">
    <div class="sc-title">${s.title}</div>
    <div class="sc-sub">${s.subtitle} · ${mc}/${all.length} 완료</div>
    <div class="sc-prog"><div class="sc-prog-fill ${bg}" style="width:${sp}%"></div></div>
  </div>
  <div class="sc-count ${bg}">${all.length}</div>
</div>`;
}).join('')}`;
}

function openSection(id){
  curSection=SECTIONS.find(s=>s.id===id);
  view='section'; render();
}

function renderSection(){
  const s=curSection;
  const all=s.subs.flatMap(sub=>sub.cards);
  const mc=all.filter(c=>memorized[cardKey(c.ref)]).length;
  const pct=all.length?Math.round(mc/all.length*100):0;
  const [bg,,txt]=COL[s.color]||COL.blue;
  app.querySelector('.inner').innerHTML=`
<div class="sec-hero ${bg}">
  <h2>${s.icon} ${s.title}</h2>
  <p>${mc} / ${all.length} 암송 완료</p>
  <div class="sec-hero-prog"><div class="sec-hero-prog-fill" style="width:${pct}%"></div></div>
</div>
<button class="start-all ${bg}" onclick="startAllCards()">전체 암송 시작 (${all.length}구절)</button>
<div class="section-label">소주제별 학습</div>
${s.subs.map((sub,i)=>{
  const smc=sub.cards.filter(c=>memorized[cardKey(c.ref)]).length;
  const sp=sub.cards.length?Math.round(smc/sub.cards.length*100):0;
  const topics=[];
  sub.cards.forEach((c,idx)=>{
    if(!topics.length||topics[topics.length-1].name!==c.topic)
      topics.push({name:c.topic,startIdx:idx,count:1});
    else topics[topics.length-1].count++;
  });
  const topicRows=topics.map(t=>`
<div class="topic-row" onclick="startCards(${i},${t.startIdx})">
  <span class="topic-rname">${t.name}</span>
  <span class="topic-rcnt">${t.count}구절</span>
  <span class="topic-rarrow">›</span>
</div>`).join('');
  return`<div class="sub-block">
  <div class="sub-header" onclick="startCards(${i})">
    <span class="sub-htitle">${sub.title}</span>
    <span class="sub-hcount">${smc}/${sub.cards.length}</span>
    <span class="sub-hbtn ${bg}">전체 ▶</span>
  </div>
  <div class="sub-hprog"><div class="sub-hprog-fill ${bg}" style="width:${sp}%"></div></div>
  <div class="topic-list">${topicRows}</div>
</div>`;
}).join('')}
`;
}

function startCards(subIdx,startIdx=0){
  curCards=curSection.subs[subIdx].cards;
  curIdx=startIdx; isFlipped=false; view='cards'; render();
}
function startAllCards(){
  curCards=curSection.subs.flatMap(s=>s.cards);
  curIdx=0; isFlipped=false; view='cards'; render();
}

let _tx=0,_ty=0;
function renderCards(){
  const s=curSection, c=curCards[curIdx];
  const isMem=memorized[cardKey(c.ref)];
  const pct=Math.round((curIdx+1)/curCards.length*100);
  const [bg,,txt]=COL[s.color]||COL.blue;
  app.querySelector('.inner').innerHTML=`
<div class="card-top">
  <span class="card-counter">${curIdx+1} / ${curCards.length}</span>
  <span class="card-topic">${c.topic||''}</span>
</div>
<div class="prog-wrap">
  <div class="prog-track"><div class="prog-bar ${bg}" style="width:${pct}%"></div></div>
</div>
<div class="flashcard${isFlipped?' flipped':''}" id="fc" onclick="toggleFlip()">
  <div class="fc-inner">
    <div class="fc-face fc-front ${bg}">
      <div class="fc-topic">${c.topic||''}</div>
      <div class="fc-ref">${c.ref}</div>
      <div class="fc-hint">👆 탭하여 구절 보기</div>
    </div>
    <div class="fc-face fc-back">
      <div class="fc-ref-sm ${txt}">${c.ref}</div>
      <div class="fc-text">${c.text}</div>
    </div>
  </div>
</div>
<div class="mem-toggle${isMem?' done':''}" onclick="toggleMem()">
  <span class="check-icon">${isMem?'✅':'⬜'}</span>
  <span>${isMem?'암송 완료':'암송 미완료'}</span>
</div>
<div class="btn-row">
  <button class="btn-prev" onclick="prevCard()"${curIdx===0?' disabled style="opacity:.35"':''}>◀ 이전</button>
  <button class="btn-next ${bg}" onclick="nextCard()"${curIdx===curCards.length-1?' disabled style="opacity:.35"':''}>다음 ▶</button>
</div>
<div class="btn-row">
  <button class="btn-again" onclick="markAndNext(false)">다시 연습</button>
  <button class="btn-know" onclick="markAndNext(true)">암송 완료 ✓</button>
</div>
<div class="swipe-hint">← 스와이프하여 카드 이동 →</div>`;

  app.ontouchstart = e=>{ _tx=e.touches[0].clientX; _ty=e.touches[0].clientY; };
  app.ontouchend = e=>{
    const dx=e.changedTouches[0].clientX-_tx;
    const dy=e.changedTouches[0].clientY-_ty;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>48){
      const fc=document.getElementById('fc');
      if(dx<0&&curIdx<curCards.length-1){
        fc.classList.add('swipe-left');
        setTimeout(()=>{curIdx++;isFlipped=false;render();},220);
      } else if(dx>0&&curIdx>0){
        fc.classList.add('swipe-right');
        setTimeout(()=>{curIdx--;isFlipped=false;render();},220);
      }
    }
  };
}

function toggleFlip(){
  isFlipped=!isFlipped;
  const fc=document.getElementById('fc');
  if(fc) fc.classList.toggle('flipped',isFlipped);
}
function prevCard(){if(curIdx>0){curIdx--;isFlipped=false;render();}}
function nextCard(){if(curIdx<curCards.length-1){curIdx++;isFlipped=false;render();}}
function markAndNext(val){
  const c=curCards[curIdx];
  memorized[cardKey(c.ref)]=val; save();
  if(val&&curIdx<curCards.length-1){curIdx++;isFlipped=false;}
  render();
}
function toggleMem(){
  const c=curCards[curIdx],k=cardKey(c.ref);
  memorized[k]=!memorized[k]; save(); render();
}

applyTheme();
// 동기화 상태 초기화 — 먼저 로컬 내용으로 그리고, 클라우드가 오면 다시 그린다
(function(){
  const el=document.getElementById('sync-status');
  if(el) el.textContent=_boardMode?('🏠 '+(_meName||'훈련관')):(_syncId?'☁️ '+_syncId:'');
  render();
  if(syncOn()){
    fbLoad().then(()=>render())
      .catch(e=>{ console.warn('fbLoad 실패',e); showSyncMsg('⚠️ '+fbErrMsg(e)); });
  }
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
